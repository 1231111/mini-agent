<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>智能体动态轨迹图</title>
    <style>
        :root {
            --bg: #0e0f12;
            --sidebar-bg: #16181d;
            --surface: #1e2127;
            --surface2: #2a2e36;
            --border: rgba(255,255,255,.09);
            --border-strong: rgba(255,255,255,.16);
            --text: #f3f4f6;
            --text2: #a8adba;
            --text3: #6b7180;
            --heading: #ffffff;
            --accent: #10a37f;
            --accent-soft: rgba(16,163,127,.14);
            --success: #22c55e;
            --failure: #ef4444;
            --warning: #f59e0b;
            --running: #3b82f6;
            --code-bg: #0a0b0d;
            --code-text: #c9d1d9;
        }

        [data-theme="light"] {
            --bg: #ffffff;
            --sidebar-bg: #f7f7f8;
            --surface: #f4f4f5;
            --surface2: #e8e8ea;
            --border: rgba(0,0,0,.1);
            --border-strong: rgba(0,0,0,.18);
            --text: #1f2024;
            --text2: #5d6068;
            --text3: #9296a0;
            --heading: #0d0d10;
            --code-bg: #f6f8fa;
            --code-text: #24292f;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: var(--bg);
            color: var(--text);
            display: flex;
            overflow: hidden;
            height: 100vh;
        }

        /* 侧边栏 */
        .sidebar {
            width: 280px;
            background: var(--sidebar-bg);
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
            height: 100vh;
            border-right: 1px solid var(--border);
        }

        .sidebar-header {
            padding: 16px;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .sidebar-header h2 {
            font-size: 16px;
            font-weight: 600;
            color: var(--heading);
        }

        .sidebar-content {
            flex: 1;
            overflow-y: auto;
            padding: 8px;
        }

        .session-item {
            padding: 10px 12px;
            border-radius: 8px;
            cursor: pointer;
            margin-bottom: 2px;
            transition: background .12s;
            border: 1px solid transparent;
        }

        .session-item:hover {
            background: var(--surface);
        }

        .session-item.active {
            background: var(--surface);
            border-color: var(--accent);
        }

        .session-title {
            font-size: 13px;
            color: var(--text);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .session-time {
            font-size: 11px;
            color: var(--text3);
            margin-top: 2px;
        }

        /* 主内容区 */
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-width: 0;
            height: 100vh;
        }

        .toolbar {
            padding: 12px 20px;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            gap: 12px;
            flex-shrink: 0;
            flex-wrap: wrap;
        }

        .toolbar h1 {
            font-size: 15px;
            font-weight: 600;
            color: var(--heading);
        }

        .toolbar-actions {
            margin-left: auto;
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .btn {
            padding: 6px 14px;
            border-radius: 8px;
            border: 1px solid var(--border);
            background: none;
            color: var(--text2);
            font-size: 12px;
            cursor: pointer;
            transition: all .15s;
            font-family: inherit;
        }

        .btn:hover {
            background: var(--surface);
            color: var(--text);
        }

        .btn.primary {
            background: var(--accent);
            color: #fff;
            border-color: var(--accent);
        }

        /* 轨迹画布 */
        .trace-canvas {
            flex: 1;
            position: relative;
            overflow: hidden;
        }

        #traceSvg {
            width: 100%;
            height: 100%;
        }

        /* 节点样式 */
        .node {
            cursor: pointer;
            transition: transform 0.2s;
        }

        .node:hover {
            transform: scale(1.05);
        }

        .node-circle {
            fill: var(--surface);
            stroke: var(--border-strong);
            stroke-width: 2;
            transition: all 0.3s;
        }

        .node-circle.running {
            stroke: var(--running);
            filter: drop-shadow(0 0 8px rgba(59,130,246,.5));
            animation: pulse 2s infinite;
        }

        .node-circle.success {
            stroke: var(--success);
            filter: drop-shadow(0 0 8px rgba(34,197,94,.5));
        }

        .node-circle.failure {
            stroke: var(--failure);
            filter: drop-shadow(0 0 8px rgba(239,68,68,.5));
        }

        .node-circle.warning {
            stroke: var(--warning);
            filter: drop-shadow(0 0 8px rgba(245,158,11,.5));
        }

        .node-icon {
            font-size: 24px;
            text-anchor: middle;
            dominant-baseline: central;
            pointer-events: none;
        }

        .node-label {
            font-size: 12px;
            fill: var(--text);
            text-anchor: middle;
            pointer-events: none;
        }

        .node-time {
            font-size: 10px;
            fill: var(--text3);
            text-anchor: middle;
            pointer-events: none;
        }

        /* 连接线 */
        .connection {
            stroke: var(--border-strong);
            stroke-width: 2;
            fill: none;
            marker-end: url(#arrowhead);
        }

        .connection.active {
            stroke: var(--running);
            stroke-width: 3;
            animation: flow 1s linear infinite;
        }

        @keyframes flow {
            0% { stroke-dashoffset: 20; }
            100% { stroke-dashoffset: 0; }
        }

        /* 轨迹粒子 */
        .particle {
            fill: var(--running);
            filter: drop-shadow(0 0 6px rgba(59,130,246,.8));
        }

        /* 状态栏 */
        .status-bar {
            padding: 12px 20px;
            border-top: 1px solid var(--border);
            display: flex;
            gap: 24px;
            flex-shrink: 0;
            background: var(--surface);
        }

        .status-item {
            display: flex;
            flex-direction: column;
        }

        .status-value {
            font-size: 20px;
            font-weight: 700;
            color: var(--heading);
        }

        .status-label {
            font-size: 11px;
            color: var(--text3);
            margin-top: 2px;
        }

        /* 详情面板 */
        .detail-panel {
            position: fixed;
            right: 20px;
            top: 20px;
            width: 320px;
            max-height: 80vh;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 12px;
            box-shadow: 0 8px 32px rgba(0,0,0,.2);
            z-index: 100;
            display: none;
            overflow: hidden;
        }

        .detail-panel.show {
            display: block;
        }

        .detail-header {
            padding: 16px;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .detail-title {
            font-size: 14px;
            font-weight: 600;
            color: var(--heading);
        }

        .detail-close {
            background: none;
            border: none;
            color: var(--text3);
            cursor: pointer;
            font-size: 16px;
        }

        .detail-body {
            padding: 16px;
            max-height: 60vh;
            overflow-y: auto;
        }

        .detail-row {
            display: flex;
            margin-bottom: 12px;
        }

        .detail-key {
            width: 100px;
            color: var(--text3);
            font-size: 12px;
        }

        .detail-value {
            flex: 1;
            color: var(--text);
            font-size: 12px;
            word-break: break-word;
        }

        /* 图例 */
        .legend {
            position: absolute;
            bottom: 20px;
            left: 20px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 12px;
            font-size: 11px;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 4px;
        }

        .legend-color {
            width: 12px;
            height: 12px;
            border-radius: 50%;
        }

        /* 控制面板 */
        .control-panel {
            position: absolute;
            top: 20px;
            left: 20px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 12px;
            font-size: 11px;
        }

        .control-item {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 4px;
        }

        .control-item label {
            color: var(--text3);
        }

        .control-item input {
            width: 60px;
            padding: 4px;
            border: 1px solid var(--border);
            border-radius: 4px;
            background: var(--surface2);
            color: var(--text);
            font-size: 11px;
        }

        /* 动画 */
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: .5; }
        }

        @keyframes moveAlongPath {
            0% { offset-distance: 0%; }
            100% { offset-distance: 100%; }
        }
    </style>
</head>
<body>
    <div class="sidebar">
        <div class="sidebar-header">
            <h2>🚀 动态轨迹</h2>
            <button class="btn" onclick="loadSessions()">刷新</button>
        </div>
        <div class="sidebar-content" id="sessionList"></div>
    </div>

    <div class="main-content">
        <div class="toolbar">
            <h1>智能体动态轨迹图</h1>
            <div class="toolbar-actions">
                <button class="btn" onclick="toggleTheme()">主题</button>
                <button class="btn" onclick="refreshTrace()">刷新轨迹</button>
                <button class="btn primary" id="playBtn" onclick="togglePlay()">▶ 播放</button>
            </div>
        </div>

        <div class="trace-canvas">
            <svg id="traceSvg">
                <defs>
                    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
                        <polygon points="0 0, 10 3.5, 0 7" fill="var(--text3)" />
                    </marker>
                    <marker id="arrowhead-active" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
                        <polygon points="0 0, 10 3.5, 0 7" fill="var(--running)" />
                    </marker>
                </defs>
            </svg>

            <div class="control-panel">
                <div class="control-item">
                    <label>动画速度:</label>
                    <input type="number" id="speedInput" value="2" min="0.5" max="5" step="0.5">
                    <span>秒</span>
                </div>
            </div>

            <div class="legend">
                <div class="legend-item">
                    <div class="legend-color" style="background: var(--running)"></div>
                    <span>运行中</span>
                </div>
                <div class="legend-item">
                    <div class="legend-color" style="background: var(--success)"></div>
                    <span>成功</span>
                </div>
                <div class="legend-item">
                    <div class="legend-color" style="background: var(--failure)"></div>
                    <span>失败</span>
                </div>
                <div class="legend-item">
                    <div class="legend-color" style="background: var(--warning)"></div>
                    <span>警告</span>
                </div>
            </div>
        </div>

        <div class="status-bar">
            <div class="status-item">
                <span class="status-value" id="nodeCount">0</span>
                <span class="status-label">节点数</span>
            </div>
            <div class="status-item">
                <span class="status-value" id="edgeCount">0</span>
                <span class="status-label">连接数</span>
            </div>
            <div class="status-item">
                <span class="status-value" id="totalTime">0ms</span>
                <span class="status-label">总耗时</span>
            </div>
            <div class="status-item">
                <span class="status-value" id="currentStep">0</span>
                <span class="status-label">当前步骤</span>
            </div>
        </div>
    </div>

    <div class="detail-panel" id="detailPanel">
        <div class="detail-header">
            <span class="detail-title" id="detailTitle">节点详情</span>
            <button class="detail-close" onclick="closeDetail()">×</button>
        </div>
        <div class="detail-body" id="detailBody"></div>
    </div>

    <script src="/js/security.js"></script>
    <script>
        // 全局变量
        let currentSession = null;
        let currentExecution = null;
        let traceData = [];
        let nodes = [];
        let edges = [];
        let isPlaying = false;
        let animationTimer = null;
        let currentStepIndex = 0;
        let particles = [];

        // 节点类型配置
        const NODE_TYPES = {
            RUN_START: { icon: '🚀', label: '任务开始', group: '生命周期' },
            RUN_END: { icon: '🏁', label: '任务结束', group: '生命周期' },
            INTENT_START: { icon: '🧭', label: '意图识别开始', group: '意图识别' },
            INTENT_L0: { icon: '⚡', label: '意图·L0规则', group: '意图识别' },
            INTENT_L1: { icon: '🔎', label: '意图·L1小模型', group: '意图识别' },
            INTENT_L2: { icon: '📐', label: '意图·L2启发式', group: '意图识别' },
            INTENT_END: { icon: '🧭', label: '意图识别结束', group: '意图识别' },
            TASK_PLAN: { icon: '🗺️', label: '执行计划定案', group: '执行计划' },
            AGENT_LOOP_START: { icon: '🔄', label: '进入主循环', group: '生命周期' },
            AGENT_LOOP_END: { icon: '🔄', label: '离开主循环', group: '生命周期' },
            PLAN: { icon: '🎯', label: '本轮目标', group: '各轮目标' },
            LLM_CALL: { icon: '⏱️', label: '模型调用', group: '模型调用' },
            TOOL_CALL: { icon: '🔧', label: '工具调用', group: '工具调用' },
            TOOL_RESULT: { icon: '✅', label: '工具返回', group: '工具调用' },
            THINKING: { icon: '💭', label: '模型思考', group: '模型调用' },
            DECISION: { icon: '🧠', label: '决策', group: '模型调用' },
            ANSWER: { icon: '📝', label: '最终回答', group: '最终结果' },
            SUB_GOAL: { icon: '📋', label: '子目标', group: '各轮目标' },
            TODO_SET: { icon: '📋', label: '任务拆分', group: '任务管理' },
            TODO_UPDATE: { icon: '☑️', label: '任务更新', group: '任务管理' },
            COMPRESSION: { icon: '🗜️', label: '上下文压缩', group: '优化' },
            ERROR: { icon: '❌', label: '错误', group: '异常' }
        };

        // 初始化
        document.addEventListener('DOMContentLoaded', () => {
            loadSessions();
            setupEventListeners();
        });

        // 加载会话列表
        async function loadSessions() {
            try {
                const resp = await fetch('/api/conversations');
                if (!resp.ok) return;
                const list = await resp.json();
                const sessionList = document.getElementById('sessionList');
                sessionList.innerHTML = '';

                if (!list.data || list.data.length === 0) {
                    sessionList.innerHTML = '<div style="padding:12px;color:var(--text3)">暂无会话</div>';
                    return;
                }

                list.data.forEach(session => {
                    const item = document.createElement('div');
                    item.className = 'session-item' + (session.sessionId === currentSession ? ' active' : '');
                    item.innerHTML = `
                        <div class="session-title">${session.title || '新对话'}</div>
                        <div class="session-time">${session.sessionId}</div>
                    `;
                    item.onclick = () => selectSession(session.sessionId);
                    sessionList.appendChild(item);
                });

                // 自动选择第一个会话
                if (list.data.length > 0 && !currentSession) {
                    selectSession(list.data[0].sessionId);
                }
            } catch (e) {
                console.error('加载会话失败:', e);
            }
        }

        // 选择会话
        async function selectSession(sessionId) {
            currentSession = sessionId;
            currentExecution = null;
            
            // 更新UI
            document.querySelectorAll('.session-item').forEach(item => {
                item.classList.remove('active');
                if (item.querySelector('.session-title').textContent === sessionId) {
                    item.classList.add('active');
                }
            });

            // 加载执行记录
            await loadExecutions(sessionId);
        }

        // 加载执行记录
        async function loadExecutions(sessionId) {
            try {
                const resp = await fetch(`/api/traces/executions?sessionId=${sessionId}`);
                if (!resp.ok) return;
                const execs = await resp.json();
                
                if (execs.data && execs.data.length > 0) {
                    currentExecution = execs.data[0].executionId;
                    await loadTraceData(currentExecution);
                }
            } catch (e) {
                console.error('加载执行记录失败:', e);
            }
        }

        // 加载轨迹数据
        async function loadTraceData(executionId) {
            try {
                const resp = await fetch(`/api/traces?executionId=${executionId}`);
                if (!resp.ok) return;
                const data = await resp.json();
                
                traceData = data.data || [];
                processTraceData();
                renderTrace();
                updateStats();
            } catch (e) {
                console.error('加载轨迹数据失败:', e);
            }
        }

        // 处理轨迹数据
        function processTraceData() {
            nodes = [];
            edges = [];
            
            // 按时间排序
            traceData.sort((a, b) => new Date(a.createdAt) - new Date(b.createdAt));
            
            // 创建节点
            traceData.forEach((step, index) => {
                const nodeType = NODE_TYPES[step.stepType] || { icon: '❓', label: step.stepType, group: '其他' };
                const node = {
                    id: step.id || index,
                    type: step.stepType,
                    icon: nodeType.icon,
                    label: nodeType.label,
                    group: nodeType.group,
                    status: step.status || 'PENDING',
                    duration: step.durationMs || 0,
                    time: step.createdAt,
                    data: step,
                    x: 0,
                    y: 0
                };
                nodes.push(node);
            });

            // 创建边（连接关系）
            for (let i = 0; i < nodes.length - 1; i++) {
                const from = nodes[i];
                const to = nodes[i + 1];
                
                // 只连接同组或相关节点
                if (from.group === to.group || 
                    from.type.includes('INTENT') && to.type.includes('INTENT') ||
                    from.type.includes('LLM') && to.type.includes('TOOL') ||
                    from.type.includes('TOOL') && to.type.includes('RESULT')) {
                    edges.push({
                        from: from.id,
                        to: to.id,
                        active: false
                    });
                }
            }
        }

        // 渲染轨迹图
        function renderTrace() {
            const svg = document.getElementById('traceSvg');
            svg.innerHTML = `
                <defs>
                    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
                        <polygon points="0 0, 10 3.5, 0 7" fill="var(--text3)" />
                    </marker>
                    <marker id="arrowhead-active" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
                        <polygon points="0 0, 10 3.5, 0 7" fill="var(--running)" />
                    </marker>
                </defs>
            `;

            if (nodes.length === 0) {
                svg.innerHTML += `
                    <text x="50%" y="50%" text-anchor="middle" fill="var(--text3)" font-size="16">
                        暂无轨迹数据
                    </text>
                `;
                return;
            }

            // 计算节点位置
            calculateNodePositions();

            // 绘制连接线
            edges.forEach(edge => {
                const fromNode = nodes.find(n => n.id === edge.from);
                const toNode = nodes.find(n => n.id === edge.to);
                if (fromNode && toNode) {
                    const line = document.createElementNS('http://www.w3.org/2000/svg', 'path');
                    const path = calculatePath(fromNode, toNode);
                    line.setAttribute('d', path);
                    line.setAttribute('class', 'connection' + (edge.active ? ' active' : ''));
                    line.setAttribute('marker-end', edge.active ? 'url(#arrowhead-active)' : 'url(#arrowhead)');
                    svg.appendChild(line);
                }
            });

            // 绘制节点
            nodes.forEach(node => {
                const group = document.createElementNS('http://www.w3.org/2000/svg', 'g');
                group.setAttribute('class', 'node');
                group.setAttribute('transform', `translate(${node.x}, ${node.y})`);
                group.onclick = () => showNodeDetail(node);

                // 节点圆形
                const circle = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
                circle.setAttribute('r', '30');
                circle.setAttribute('class', 'node-circle ' + getStatusClass(node.status));
                group.appendChild(circle);

                // 图标
                const icon = document.createElementNS('http://www.w3.org/2000/svg', 'text');
                icon.setAttribute('class', 'node-icon');
                icon.textContent = node.icon;
                group.appendChild(icon);

                // 标签
                const label = document.createElementNS('http://www.w3.org/2000/svg', 'text');
                label.setAttribute('class', 'node-label');
                label.setAttribute('y', '45');
                label.textContent = node.label;
                group.appendChild(label);

                // 耗时
                const time = document.createElementNS('http://www.w3.org/2000/svg', 'text');
                time.setAttribute('class', 'node-time');
                time.setAttribute('y', '60');
                time.textContent = formatDuration(node.duration);
                group.appendChild(time);

                svg.appendChild(group);
            });
        }

        // 计算节点位置
        function calculateNodePositions() {
            const svg = document.getElementById('traceSvg');
            const width = svg.clientWidth || 800;
            const height = svg.clientHeight || 600;
            
            // 按组分组
            const groups = {};
            nodes.forEach(node => {
                if (!groups[node.group]) groups[node.group] = [];
                groups[node.group].push(node);
            });

            const groupNames = Object.keys(groups);
            const groupCount = groupNames.length;
            
            // 水平排列各组
            const groupWidth = width / (groupCount + 1);
            
            groupNames.forEach((groupName, groupIndex) => {
                const groupNodes = groups[groupName];
                const groupX = groupWidth * (groupIndex + 1);
                
                // 垂直排列组内节点
                const nodeHeight = height / (groupNodes.length + 1);
                groupNodes.forEach((node, nodeIndex) => {
                    node.x = groupX;
                    node.y = nodeHeight * (nodeIndex + 1);
                });
            });
        }

        // 计算路径
        function calculatePath(from, to) {
            const dx = to.x - from.x;
            const dy = to.y - from.y;
            
            // 贝塞尔曲线
            const cx1 = from.x + dx * 0.3;
            const cy1 = from.y;
            const cx2 = from.x + dx * 0.7;
            const cy2 = to.y;
            
            return `M ${from.x} ${from.y} C ${cx1} ${cy1}, ${cx2} ${cy2}, ${to.x} ${to.y}`;
        }

        // 获取状态样式
        function getStatusClass(status) {
            switch (status) {
                case 'RUNNING': return 'running';
                case 'SUCCESS': return 'success';
                case 'FAILURE': return 'failure';
                case 'TIMEOUT': return 'warning';
                default: return '';
            }
        }

        // 格式化时长
        function formatDuration(ms) {
            if (!ms) return '—';
            if (ms >= 1000) return (ms / 1000).toFixed(1) + 's';
            return ms + 'ms';
        }

        // 更新统计
        function updateStats() {
            document.getElementById('nodeCount').textContent = nodes.length;
            document.getElementById('edgeCount').textContent = edges.length;
            
            const totalTime = nodes.reduce((sum, node) => sum + (node.duration || 0), 0);
            document.getElementById('totalTime').textContent = formatDuration(totalTime);
            
            document.getElementById('currentStep').textContent = currentStepIndex + '/' + nodes.length;
        }

        // 显示节点详情
        function showNodeDetail(node) {
            const panel = document.getElementById('detailPanel');
            const title = document.getElementById('detailTitle');
            const body = document.getElementById('detailBody');
            
            title.textContent = node.icon + ' ' + node.label;
            
            let html = `
                <div class="detail-row">
                    <div class="detail-key">节点类型</div>
                    <div class="detail-value">${node.type}</div>
                </div>
                <div class="detail-row">
                    <div class="detail-key">状态</div>
                    <div class="detail-value">${node.status || '—'}</div>
                </div>
                <div class="detail-row">
                    <div class="detail-key">耗时</div>
                    <div class="detail-value">${formatDuration(node.duration)}</div>
                </div>
                <div class="detail-row">
                    <div class="detail-key">时间</div>
                    <div class="detail-value">${new Date(node.time).toLocaleString()}</div>
                </div>
                <div class="detail-row">
                    <div class="detail-key">分组</div>
                    <div class="detail-value">${node.group}</div>
                </div>
            `;
            
            // 显示内容
            if (node.data.content) {
                html += `
                    <div class="detail-row">
                        <div class="detail-key">内容</div>
                        <div class="detail-value">${node.data.content}</div>
                    </div>
                `;
            }
            
            // 显示工具信息
            if (node.data.toolName) {
                html += `
                    <div class="detail-row">
                        <div class="detail-key">工具</div>
                        <div class="detail-value">${node.data.toolName}</div>
                    </div>
                `;
            }
            
            body.innerHTML = html;
            panel.classList.add('show');
        }

        // 关闭详情面板
        function closeDetail() {
            document.getElementById('detailPanel').classList.remove('show');
        }

        // 播放动画
        function togglePlay() {
            isPlaying = !isPlaying;
            const btn = document.getElementById('playBtn');
            btn.textContent = isPlaying ? '⏸ 暂停' : '▶ 播放';
            
            if (isPlaying) {
                playAnimation();
            } else {
                clearTimeout(animationTimer);
            }
        }

        // 播放动画
        function playAnimation() {
            if (!isPlaying || currentStepIndex >= nodes.length) {
                isPlaying = false;
                document.getElementById('playBtn').textContent = '▶ 播放';
                return;
            }

            // 高亮当前节点
            highlightNode(currentStepIndex);
            
            // 更新统计
            updateStats();
            
            // 下一步
            const speed = parseFloat(document.getElementById('speedInput').value) || 2;
            animationTimer = setTimeout(() => {
                currentStepIndex++;
                playAnimation();
            }, speed * 1000);
        }

        // 高亮节点
        function highlightNode(index) {
            // 重置所有节点
            document.querySelectorAll('.node-circle').forEach(circle => {
                circle.classList.remove('running');
            });
            
            // 高亮当前节点
            const node = nodes[index];
            if (node) {
                const svg = document.getElementById('traceSvg');
                const nodeGroups = svg.querySelectorAll('.node');
                if (nodeGroups[index]) {
                    const circle = nodeGroups[index].querySelector('.node-circle');
                    if (circle) {
                        circle.classList.add('running');
                    }
                }
                
                // 激活连接线
                edges.forEach(edge => {
                    if (edge.to === node.id) {
                        edge.active = true;
                    }
                });
                
                renderTrace();
            }
        }

        // 刷新轨迹
        function refreshTrace() {
            if (currentExecution) {
                loadTraceData(currentExecution);
            }
        }

        // 切换主题
        function toggleTheme() {
            const current = document.documentElement.getAttribute('data-theme');
            const next = current === 'light' ? 'dark' : 'light';
            document.documentElement.setAttribute('data-theme', next);
            localStorage.setItem('mini_agent_theme', next);
        }

        // 设置事件监听
        function setupEventListeners() {
            // 窗口大小改变时重新渲染
            window.addEventListener('resize', () => {
                calculateNodePositions();
                renderTrace();
            });
            
            // 点击空白处关闭详情面板
            document.getElementById('traceSvg').addEventListener('click', (e) => {
                if (e.target === document.getElementById('traceSvg')) {
                    closeDetail();
                }
            });
        }
    </script>
</body>
</html>
