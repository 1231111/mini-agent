# Local development values are read from the gitignored .env file or IDE environment.
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: ${DB_URL:jdbc:mysql://127.0.0.1:3306/mini_agent?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai&characterEncoding=UTF-8}
    password: ${DB_PASSWORD:}
  data:
    redis:
      password: ${REDIS_PASSWORD:}

agent:
  auth:
    jwt-secret: ${JWT_SECRET:${COOKIE_SECRET:}}
  account:
    cloud:
      internal-key: ${ACCOUNT_INTERNAL_KEY:}
  tools:
    exec-policy: ask
