spring:
  thymeleaf:
    cache: true
  jpa:
    hibernate:
      # Prefer validate + Flyway in mature deploys; update keeps first-land simple.
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
  mvc:
    async:
      request-timeout: 1800000

server:
  tomcat:
    connection-timeout: 1800000

logging:
  level:
    com.miniagent: INFO
    root: WARN

agent:
  tools:
    exec-enabled: false
    allow-absolute-write: false
    block-private-network: true
  rate-limit:
    per-minute: 30
  concurrency:
    max-tasks-per-user: 2
  sse:
    timeout-ms: 1800000

management:
  endpoint:
    health:
      show-details: never
