# Docker / 生产覆盖：数据源指向 compose 内的 mysql 服务名
spring:
  thymeleaf:
    cache: true
  datasource:
    url: jdbc:mysql://mysql:3306/mini_agent?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai&characterEncoding=UTF-8
    username: root
    password: mysql_root_pass
  jpa:
    hibernate:
      ddl-auto: update

logging:
  level:
    com.miniagent: INFO
    root: WARN

agent:
  tools:
    exec-enabled: false
    allow-absolute-write: false
    block-private-network: true
  rate-limit:
    per-minute: 30
  concurrency:
    max-tasks-per-user: 2

management:
  endpoint:
    health:
      show-details: never
