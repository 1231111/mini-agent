# Docker / 生产覆盖：MySQL + Redis + Milvus
spring:
  thymeleaf:
    cache: true
  datasource:
    url: jdbc:mysql://mysql:3306/mini_agent?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai&characterEncoding=UTF-8
    username: root
    password: mysql_root_pass
  data:
    redis:
      host: redis
      port: 6379
  jpa:
    hibernate:
      ddl-auto: update

logging:
  level:
    com.miniagent: INFO
    root: WARN

agent:
  replica:
    mode: redis
  memory:
    storage: db
    vector:
      backend: milvus
      milvus:
        uri: http://milvus:19530
  todo:
    storage: db
  planner:
    enabled: true
    storage: db
  tools:
    exec-enabled: false
    allow-absolute-write: false
    block-private-network: true
  rate-limit:
    per-minute: 30
  concurrency:
    max-tasks-per-user: 2

management:
  endpoint:
    health:
      show-details: never
  health:
    redis:
      enabled: true
