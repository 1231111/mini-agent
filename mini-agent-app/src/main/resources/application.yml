spring:
  thymeleaf:
    cache: false
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB
      enabled: true
  application:
    name: mini-agent-springboot
  mvc:
    async:
      request-timeout: ${AGENT_MVC_TIMEOUT_MS:1800000}
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://127.0.0.1:3306/mini_agent?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai&characterEncoding=UTF-8}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: ${SPRING_JPA_DDL_AUTO:update}
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
    open-in-view: false
server:
  port: ${SERVER_PORT:8080}
  tomcat:
    connection-timeout: ${AGENT_TOMCAT_TIMEOUT_MS:1800000}
    max-http-request-header-size: 64KB
    max-swallow-size: 64MB

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when_authorized

langchain4j:
  open-ai:
    chat-model:
      api-key: ${LANGCHAIN4J_OPENAI_API_KEY:}
      base-url: ${LANGCHAIN4J_OPENAI_BASE_URL:https://token-plan-cn.xiaomimimo.com/v1}
      model-name: ${LANGCHAIN4J_OPENAI_MODEL:mimo-v2.5}
      timeout: 1200s
      returnThinking: true
      sendThinking: false
    streaming-chat-model:
      api-key: ${LANGCHAIN4J_OPENAI_API_KEY:}
      base-url: ${LANGCHAIN4J_OPENAI_BASE_URL:https://token-plan-cn.xiaomimimo.com/v1}
      model-name: ${LANGCHAIN4J_OPENAI_MODEL:mimo-v2.5}
      timeout: 1200s
      returnThinking: true
      sendThinking: false

agent:
  auth:
    cookie-secret: ${AGENT_AUTH_COOKIE_SECRET:dev-only-change-me-in-production-32chars}
    cookie-max-age-seconds: 604800
  chat-memory:
    max-messages: 24
  context:
    max-tokens: 256000
    compress-threshold: 0.75
  memory:
    vector:
      enabled: true
      top-k: 6
      min-score: 0.4
  sse:
    timeout-ms: ${AGENT_SSE_TIMEOUT_MS:1800000}
  codebase:
    embedding-enabled: true
    embedding-api-key: ${AGENT_CODEBASE_EMBEDDING_API_KEY:}
    embedding-base-url: ${AGENT_CODEBASE_EMBEDDING_BASE_URL:https://api.chatanywhere.tech/v1}
    embedding-model: BAAI/bge-m3
    index-file: ./workspace/.codebase-index.json
  tools:
    exec-enabled: ${AGENT_TOOLS_EXEC_ENABLED:false}
    allow-absolute-write: ${AGENT_TOOLS_ALLOW_ABSOLUTE_WRITE:false}
    block-private-network: ${AGENT_TOOLS_BLOCK_PRIVATE_NETWORK:true}
  rate-limit:
    per-minute: ${AGENT_RATE_LIMIT_PER_MINUTE:60}
  concurrency:
    max-tasks-per-user: ${AGENT_MAX_CONCURRENT_TASKS_PER_USER:2}
  todo:
    persist-dir: ${AGENT_TODO_PERSIST_DIR:./workspace/.todos}

logging:
  level:
    com.miniagent: ${AGENT_LOG_LEVEL:INFO}
    root: INFO

web:
  search:
    backend: ${WEB_SEARCH_BACKEND:}
    tavily-api-key: ${WEB_SEARCH_TAVILY_API_KEY:}
    bing-api-key: ${WEB_SEARCH_BING_API_KEY:}
    google-api-key: ${WEB_SEARCH_GOOGLE_API_KEY:}
    google-cse-id: ${WEB_SEARCH_GOOGLE_CSE_ID:}

image:
  gen:
    mimo-api-key: ${IMAGE_GEN_MIMO_API_KEY:${LANGCHAIN4J_OPENAI_API_KEY:}}
    mimo-base-url: ${IMAGE_GEN_MIMO_BASE_URL:${LANGCHAIN4J_OPENAI_BASE_URL:https://token-plan-cn.xiaomimimo.com/v1}}
    mimo-model: ${IMAGE_GEN_MIMO_MODEL:MiMo-V2.5}
    chatanywhere-key: ${IMAGE_GEN_CHATANYWHERE_KEY:}
    chatanywhere-base-url: ${IMAGE_GEN_CHATANYWHERE_BASE_URL:https://api.chatanywhere.tech/v1}
    chatanywhere-model: ${IMAGE_GEN_CHATANYWHERE_MODEL:gpt-image-2-ca}
    siliconflow-api-key: ${IMAGE_GEN_SILICONFLOW_API_KEY:}
    fal-key: ${IMAGE_GEN_FAL_KEY:}
    zhipu-api-key: ${IMAGE_GEN_ZHIPU_API_KEY:}

file:
  upload:
    base-dir: ./user-uploads
    max-size: 10485760

comfyui:
  host: ${COMFYUI_HOST:127.0.0.1}
  port: ${COMFYUI_PORT:8188}
  quality-check:
    enabled: ${COMFYUI_QUALITY_CHECK_ENABLED:true}
