file:
  upload:
    # 已弃用：实际上传到 agent.data-dir/media/uploads（MediaStorage）
    base-dir: unused
    max-size: 52428800           # 50MB，与 spring.servlet.multipart.max-file-size 对齐
  extract:
    max-bytes: 52428800          # 单文件原始大小上限 50MB
    max-inline-chars: 80000      # 单文件提取后内联截断
    max-context-chars: 120000    # 多附件合计注入上下文预算
    sidecar-threshold-chars: 20000  # 超过则写 .extracted.txt 侧车

