spring:
  thymeleaf:
    cache: false   # 开发期关闭模板缓存：改完 .html 刷新页面即可生效，无需重启
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 55MB
      enabled: true
  application:
    name: mini-agent-springboot
  mvc:
    async:
      request-timeout: 1800000
  datasource:
    url: jdbc:mysql://127.0.0.1:3306/mini_agent?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai&characterEncoding=UTF-8
    username: root
    password: mysql_root_pass
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: 127.0.0.1
      port: 6379
      timeout: 3s
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
    open-in-view: false

server:
  port: 8080
  tomcat:
    connection-timeout: 1800000
    max-http-request-header-size: 64KB
    max-swallow-size: 100MB

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when_authorized
  health:
    # local 默认不依赖 Redis；prod/redis 模式再开
    redis:
      enabled: false

# LangChain4j OpenAI 兼容客户端
langchain4j:
  open-ai:
    chat-model:
      api-key: tp-c9w1dsoho0uhtzdzmndf2a89pmzos44uut4za8rt2wkatxuc
      base-url: https://token-plan-cn.xiaomimimo.com/v1
      model-name: mimo-v2.5
      timeout: 1200s
      returnThinking: true
      sendThinking: false
    streaming-chat-model:
      api-key: tp-c9w1dsoho0uhtzdzmndf2a89pmzos44uut4za8rt2wkatxuc
      base-url: https://token-plan-cn.xiaomimimo.com/v1
      model-name: mimo-v2.5
      timeout: 1200s
      returnThinking: true
      sendThinking: false

# Agent 配置
agent:
  # 统一数据根（记忆/媒体/skills/workspace）。可用环境变量 MINI_AGENT_HOME 覆盖。
  # 默认：{user.home}/.miniagent ，不再写入项目仓库旁路目录。
  data-dir: ${MINI_AGENT_HOME:${user.home}/.miniagent}
  auth:
    cookie-secret: miniagent-dev-cookie-secret-change-if-needed!!
    cookie-max-age-seconds: 604800
  # 意图识别漏斗：L0 配置规则 → L1 小模型 → L2 启发式（场景词只写在这里）
  # L0 规则运行时：启动时若 MySQL 无 ACTIVE rule_set 则从下方 YAML bootstrap；之后以 DB 为准，支持反馈学习热发布
  intent:
    llm-enabled: true
    min-confidence: 0.65
    history-max-messages: 8
    history-max-chars: 4000
    timeout-seconds: 60
    model-name: "qwen2.5:1.5b"
    base-url: "http://127.0.0.1:11434/v1"
    api-key: "ollama"
    # classifier-system-prompt: |   # 可选覆盖；默认用代码内通用模板
    rules:
      force-full-on-web-and-file: true
      force-full-on-image-into-doc: true
      pure-image-max-len: 40
      question-max-len: 80
      review-max-len: 10
      web-signals:
        - "(?i)https?://"
        - "(?i)飞书|feishu|lark|wiki"
        - "(?i)抓取|爬取|打开网页|访问(该|这个)?(链接|地址|网址)"
        - "(?i)获取.{0,12}(资料|内容|页面)|web_extract|browser"
      file-signals:
        - "(?i)\\.md\\b|markdown|md\\s*文件"
        - "(?i)写(到|入)?桌面|桌面上|文档|write_file|保存到"
      image-into-doc-signals:
        - "(?i)(替换|写入|插入|写进|写到|放到|更新到|贴到).{0,40}(md|markdown|文档|\\.md)"
        - "(?i)(md|markdown|文档|\\.md).{0,40}(替换|写入|插入)"
        - "(?i)替换到你生成的|要有图片|包含图片|带上?图片|配上?图"
      pure-image-signals:
        - "(?i)画一?[张幅]|画个|画一张"
        - "(?i)文生图|图生图|txt2img|img2img"
        - "(?i)生成一?[张幅].{0,24}(图|图片|插画|海报|封面|壁纸|结构图|架构图|流程图)"
        - "(?i)draw\\s+(a|an|me)|generate\\s+(an?\\s+)?image|create\\s+(an?\\s+)?image"
        - "(?i)make\\s+(an?\\s+)?(image|picture|illustration)"
      question-signals:
        - "(?i)^\\s*(你(可以|能)做(什么|哪些)(事情|事)?|你有什么(能力|功能|本事)|你会什么|能做什么|有什么(能力|功能)|怎么用你|如何使用你|你会哪些|你都支持哪些|有哪些工具|支持什么功能|你是谁|介绍一下你(自己)?|自我介绍|help|what can you do|who are you|what are you|what do you support|你好|您好|hello|hi+|hey)\\s*[?？！!。.~…]*\\s*$"
      task-action-signals:
        - "(?i)生成|画|写|创建|修改|编辑|替换|删除|执行|运行|部署|搜索|打开|爬|下载|实现|开发|搭建|设计文档|建表|refactor|implement|deploy|generate"
      continue-signals:
        - "(?i)^(继续|接着(做|干|写|改)?|然后(把|再|继续)|按刚才的|在上次基础上|接着上次)"
      complex-signals:
        - "(?i)一整套|完整(的)?(项目|系统|方案|架构|平台)|多模块|多个文件|分别(实现|生成|写)|并且.*并且"
        - "(?i)拆成|分步|步骤|阶段|里程碑|脚手架|骨架|monorepo|微服务|架构设计|技术方案|系统设计|从零(开始|搭建)|端到端"
        - "(?i)至少\\s*\\d+|不少于\\s*\\d+|\\d+\\s*个(文件|模块|接口|页面|服务)"
        - "(?i)generate\\s+(a\\s+)?(full|complete|entire)|scaffold|multi[- ]?step|end[- ]to[- ]end"
        - "(?i)然后.*(再|接着|最后)|先.*再.*最后|建库|建表|CREATE\\s+TABLE|CREATE\\s+DATABASE"
      image-and-doc-signals:
        - "(?i)(生成|画).{0,40}(图|图片|结构图|架构图|流程图|插画).{0,60}(替换|写入|插入|写进|写到|放到).{0,40}(md|markdown|文档|\\.md)"
        - "(?i)(替换|写入|插入|写进|写到|放到).{0,40}(md|markdown|文档|\\.md).{0,40}(图|图片|结构图)"
        - "(?i)替换到你生成的|(生成|画).{0,40}(图|结构图|架构图).{0,40}替换"
    tool-profiles:
      # full 留空 = 使用 ToolRegistry 全量（含 MCP），不写死工具名
      full: []
      image:
        - image_generate
        - comfyui_status
        - comfyui_workflows
        - comfyui_models
        - comfyui_execute
        - comfyui_txt2img
        - comfyui_img2img
        - comfyui_check_quality
        - comfyui_img2video
        - todo
        - memory
      question:
        - skill_list
        - skill_view
        - memory
  # 聊天模型预设（前端可选；空字段回退 langchain4j.open-ai.chat-model.*）
  models:
    default-preset: default
    presets:
      - id: default
        label: MiMo v2.5
      - id: chatanywhere
        label: ChatAnywhere
        base-url: https://api.chatanywhere.tech/v1
        model-name: gpt-4o-mini
        api-key: sk-S5B6jjx0B3yMvxLAojE3Y94yxOzQUj7FmZFO8UTaFWcsDyby
  chat-memory:
    max-messages: 24
  context:
    max-tokens: 256000
    compress-threshold: 0.75
    # false=Loop 内硬截断不调 LLM；摘要改后台异步，避免 P99 翻倍
    llm-summary-enabled: false
    history:
      question: 0
      # QUESTION 指代：相关度精捞最多保留条数（非盲目最近 N）
      question-with-ref: 6
      # 指代精捞：从会话末尾向前扫描的候选池大小
      ref-scan-max: 48
      # 弱代词指代时保底附带的最近消息条数
      ref-pronoun-anchor: 4
      # 指代精捞：写入时持久化会话向量；检索优先向量库，失败回退扫描窗/词重叠
      ref-vector-enabled: true
      ref-min-score: 0.35
      vector:
        # Milvus 集合名（backend 与 agent.memory.vector.backend 一致）
        collection: agent_session_history
      review: 4
      new-task: 6
      continue: -1
      image: -1
      default: -1
  # local=单机不启 Redis 热存储/跨实例事件；redis=写穿热存储+任务并发+发布订阅（生产/compose）
  replica:
    mode: local
    todo-ttl-seconds: 86400
    memory-ttl-seconds: 86400
    planner-ttl-seconds: 86400
    run-lock-ttl-seconds: 7200
  memory:
    # db=多副本真相源（agent_user_memory）；file=仅本地目录
    storage: db
    vector:
      enabled: true
      # local=本机 InMemory+JSON；milvus=生产向量库（compose/prod）
      backend: local
      top-k: 6
      min-score: 0.4
      milvus:
        uri: http://127.0.0.1:19530
        token:
        collection: agent_memory
        # Yuan-embedding-2.0-zh=1792；改模型需重建 Milvus 集合
        dimension: 1792
  sse:
    timeout-ms: 1800000
  codebase:
    embedding-enabled: true
    # 本地 embedding-server（compose: embedding / 本机 :8008）
    embedding-api-key: local
    embedding-base-url: http://127.0.0.1:8008/v1
    embedding-model: Yuan-embedding-2.0-zh
    index-file: ${agent.data-dir}/workspace/.codebase-index.json
  tools:
    exec-enabled: false
    allow-absolute-write: false
    block-private-network: true
  rate-limit:
    per-minute: 60
  concurrency:
    max-tasks-per-user: 2
  multimodal:
    # MiMo Base64 串上限约 50MB → 源文件约 35MB
    audio-max-bytes: 36700160
    video-max-bytes: 36700160
    # 有图/音视频时改用该预设（default=MiMo v2.5）；空=沿用用户当前模型
    vision-preset: default
  todo:
    # db=多副本真相源（agent_session_todos）；file=仅本地 JSON
    storage: db
    persist-dir: ${agent.data-dir}/workspace/.todos
  # 生产级 Planner：GoalCompiler + PlanningLoop + Recovery（Todo/Trace 为投影）
  planner:
    enabled: true
    # db=多副本真相源（agent_session_planner）；file=本地 JSON；memory=仅进程内（勿用于扩容）
    storage: db
    persist-dir: ${agent.data-dir}/workspace/.planner
    force-for-intents:
      - NEW_TASK
      - RESEARCH
      - FILE_DELIVERY
      - PUBLISHING
      - CONTINUE_TASK
    skip-intents:
      - QUESTION
      - REVIEW
    max-recoveries: 3
    proposal-batch-size: 1
    proposal-max-iterations: 8
    compiler-retry: 1
    max-outer-rounds: 24
    hard-proposal: true
    strict-eval: true
    max-local-repair: 3
    max-replace-tool: 2
    max-rewrite-graph: 2
    max-revise-goal: 1
  # 流式中途预执行只读工具（onCompleteToolCall）
  streaming:
    prefetch-readonly: true
  # 会话累计 token 软预算（0=关闭）；超限后注入一次提醒，不硬杀
  token-budget:
    max-total: 0
  # MCP：启用后启动时连接 servers 并把 tools 注册为 mcp__{id}__{tool}
  # POST /api/mcp/refresh 可热更新 tools/list
  mcp:
    enabled: false
    servers: []
    # 示例：
    # servers:
    #   - id: filesystem
    #     transport: stdio
    #     command: npx
    #     args: ["-y", "@modelcontextprotocol/server-filesystem", "./workspace"]

