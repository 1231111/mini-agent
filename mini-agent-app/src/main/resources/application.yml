spring:
  thymeleaf:
    cache: false   # 开发期关闭模板缓存：改完 .html 刷新页面即可生效，无需重启
  servlet:
    multipart:
      max-file-size: 700MB
      max-request-size: 710MB
      enabled: true
  application:
    name: mini-agent-springboot
  mvc:
    async:
      request-timeout: 1800000
  datasource:
    url: ${DB_URL:jdbc:mysql://127.0.0.1:3306/mini_agent?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai&characterEncoding=UTF-8}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:${MYSQL_PASSWORD:mysql_root_pass}}
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: 127.0.0.1
      port: 6379
      password: ${REDIS_PASSWORD:}
      timeout: 3s
  flyway:
    enabled: false
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
    open-in-view: false

server:
  port: 8080
  tomcat:
    connection-timeout: 1800000
    max-http-form-post-size: 710MB
    max-http-request-header-size: 64KB
    # -1：拒绝超限请求时也把 body 读完再关连接。100MB 会在 700MB 上传途中把连接掐掉。
    max-swallow-size: -1

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when_authorized
  health:
    # local 默认不依赖 Redis；prod/redis 模式再开
    redis:
      enabled: false

# LangChain4j OpenAI 兼容客户端
langchain4j:
  open-ai:
    chat-model:
      # LLM_API_KEY 未设置时复用 MiMo 配置，避免对话和 Episode 提炼使用占位 Key。
      api-key: ${LLM_API_KEY:${image.gen.mimo-api-key:not-configured}}
      base-url: ${LLM_BASE_URL:https://token-plan-cn.xiaomimimo.com/v1}
      model-name: ${LLM_MODEL:mimo-v2.6-pro}
      timeout: 1200s
      returnThinking: true
      sendThinking: false
    streaming-chat-model:
      # 流式模型与普通模型保持同一套认证配置。
      api-key: ${LLM_API_KEY:${image.gen.mimo-api-key:not-configured}}
      base-url: ${LLM_BASE_URL:https://token-plan-cn.xiaomimimo.com/v1}
      model-name: ${LLM_MODEL:mimo-v2.6-pro}
      timeout: 1200s
      returnThinking: true
      sendThinking: false

# Agent 配置
agent:
  # 统一数据根（记忆/媒体/skills/workspace）。可用环境变量 MINI_AGENT_HOME 覆盖。
  # 默认：{user.home}/.miniagent ，不再写入项目仓库旁路目录。
  data-dir: ${MINI_AGENT_HOME:${user.home}/.miniagent}
  auth:
    cookie-secret: ${COOKIE_SECRET:local-dev-cookie-secret-not-for-production}
    # JWT 方案：exp 仅为硬性上限；真实滑动超时由 Redis TTL 控制
    jwt-exp-seconds: 604800      # JWT 有效期上限（7 天），兜底用
    jwt-ttl-seconds: 1800       # Redis 滑动会话窗口（30 分钟），每次鉴权刷新
    secure-cookie: false
    same-site: Lax
    registration-enabled: true
    password-min-length: 8
    bcrypt-strength: 10
    allowed-origins: http://localhost:*,http://127.0.0.1:*,file://
  # 任务信号：只从用户消息里提取「已经出现的事实」，不做分类、不选类别。
  # 每条词表命中的就是命中的，可以逐条复核；下游各取所需，一处失效不牵连别处。
  task-signals:
    rules:
      # 语义判断（复杂任务/图配文档）的开关
      force-full-on-image-into-doc: true
      question-max-len: 80   # 超过这个长度就不再当作短问答/短指令
      # ── 事实词表：命中即为真，以下每一条都只描述「文本里出现了什么」 ──
      web-signals:
        - "(?i)https?://"
        - "(?i)飞书|feishu|lark|wiki"
        - "(?i)抓取|爬取|打开网页|访问(该|这个)?(链接|地址|网址)"
        - "(?i)获取.{0,12}(资料|内容|页面)|web_extract|browser"
        - "(?i)搜索|检索|调研|搜一下|查一下"
      file-signals:
        - "(?i)\\.md\\b|markdown|md\\s*文件"
        - "(?i)写(到|入)?桌面|桌面上|文档|write_file|保存到"
        - "(?i)架构图|流程图|时序图|结构图|mermaid|render_diagram|\\.mmd\\b"
      image-into-doc-signals:
        - "(?i)(图片|海报|插画|壁纸|封面|配图).{0,40}(替换|写入|插入|写进|写到|放到|贴到).{0,40}(md|markdown|文档|\\.md)"
        - "(?i)(替换|写入|插入|写进|写到|放到|贴到).{0,40}(md|markdown|文档|\\.md).{0,40}(图片|海报|插画|配图)"
        - "(?i)替换到你生成的|要有图片|包含图片|带上?图片|配上?图"
      pure-image-signals:
        - "(?i)画一?[张幅]|画个|画一张"
        - "(?i)文生图|图生图|txt2img|img2img"
        - "(?i)生成一?[张幅].{0,24}(海报|封面|壁纸|插画|图片)"
        - "(?i)draw\\s+(a|an|me)|generate\\s+(an?\\s+)?image|create\\s+(an?\\s+)?image"
        - "(?i)make\\s+(an?\\s+)?(image|picture|illustration)"
      question-signals:
        - "(?i)^\\s*(你(可以|能)做(什么|哪些)(事情|事)?|你有什么(能力|功能|本事)|你会什么|能做什么|有什么(能力|功能)|怎么用你|如何使用你|你会哪些|你都支持哪些|有哪些工具|支持什么功能|你是谁|介绍一下你(自己)?|自我介绍|help|what can you do|who are you|what are you|what do you support|你好|您好|hello|hi+|hey)\\s*[?？！!。.~…]*\\s*$"
      task-action-signals:
        - "(?i)生成|画|写|创建|修改|编辑|替换|删除|执行|运行|部署|搜索|打开|爬|下载|实现|开发|搭建|设计文档|建表|refactor|implement|deploy|generate"
      continue-signals:
        - "(?i)^(继续|接着(做|干|写|改)?|然后(把|再|继续)|按刚才的|在上次基础上|接着上次)"
      complex-signals:
        - "(?i)一整套|完整(的)?(项目|系统|方案|架构|平台)|多模块|多个文件|分别(实现|生成|写)|并且.*并且"
        - "(?i)拆成|分步|步骤|阶段|里程碑|脚手架|骨架|monorepo|微服务|架构设计|技术方案|系统设计|从零(开始|搭建)|端到端"
        - "(?i)至少\\s*\\d+|不少于\\s*\\d+|\\d+\\s*个(文件|模块|接口|页面|服务)"
        - "(?i)generate\\s+(a\\s+)?(full|complete|entire)|scaffold|multi[- ]?step|end[- ]to[- ]end"
        - "(?i)然后.*(再|接着|最后)|先.*再.*最后|建库|建表|CREATE\\s+TABLE|CREATE\\s+DATABASE"
      image-and-doc-signals:
        - "(?i)(生成|画).{0,40}(图|图片|结构图|架构图|流程图|插画).{0,60}(替换|写入|插入|写进|写到|放到).{0,40}(md|markdown|文档|\\.md)"
        - "(?i)(替换|写入|插入|写进|写到|放到).{0,40}(md|markdown|文档|\\.md).{0,40}(图|图片|结构图)"
        - "(?i)替换到你生成的|(生成|画).{0,40}(图|结构图|架构图).{0,40}替换"
  # 聊天模型预设（前端可选；空字段回退 langchain4j.open-ai.chat-model.*）
  models:
    default-preset: default
    presets:
      - id: default
        label: MiMo v2.5
      - id: chatanywhere
        label: ChatAnywhere
        base-url: https://api.chatanywhere.tech/v1
        model-name: gpt-4o-mini
        api-key: sk-S5B6jjx0B3yMvxLAojE3Y94yxOzQUj7FmZFO8UTaFWcsDyby
  chat-memory:
    # 跨请求滑动窗口条数（非 token）。单轮 Loop 内由 context.max-tokens 压缩。
    max-messages: 64
  context:
    # 单次请求工作窗口（估算 token）。DeepSeek 1M 不填满：预留 thinking、
    # 工具 schema、中文分词低估。75% 时压缩 → 约 384k 估算工作集。
    max-tokens: 512000
    compress-threshold: 0.75
    # false=Loop 内硬截断不调 LLM；摘要改后台异步，避免 P99 翻倍
    llm-summary-enabled: false
    budget:
      enabled: true
      chars-per-token: 2.0
      slot-tokens:
        identity: 2000
        authority: 400
        question: 800
        reference: 300
        memory: 6000
        skills: 2000
        reasoning: 1500
        tools: 4000
        todo: 2000
        closing: 1500
    history:
      # 问答轮（问且无动手信号）保留的历史条数。
      # 不能给 0：历史清空后模型看不到上一轮在谈什么，跨轮追问必然答错。
      question: 6
      # QUESTION 指代：相关度精捞最多保留条数（非盲目最近 N）
      question-with-ref: 6
      # 指代精捞：从会话末尾向前扫描的候选池大小
      ref-scan-max: 48
      # 弱代词指代时保底附带的最近消息条数
      ref-pronoun-anchor: 4
      # 指代精捞：写入时持久化会话向量；检索优先向量库，失败回退扫描窗/词重叠
      ref-vector-enabled: true
      ref-min-score: 0.35
      vector:
        # Milvus 集合名（backend 与 agent.memory.vector.backend 一致）
        collection: agent_session_history
  # local=单机不启 Redis 热存储/跨实例事件；redis=写穿热存储+任务并发+发布订阅（生产/compose）
  replica:
    mode: local
    todo-ttl-seconds: 86400
    memory-ttl-seconds: 86400
    planner-ttl-seconds: 86400
    run-lock-ttl-seconds: 7200
  memory:
    # db=多副本真相源（agent_user_memory）；file=仅本地目录
    storage: db
    vector:
      enabled: true
      # local=本机 InMemory+JSON；milvus=生产向量库（compose/prod）
      backend: local
      top-k: 6
      min-score: 0.4
      milvus:
        uri: http://127.0.0.1:19530
        token:
        collection: agent_memory
        # Yuan-embedding-2.0-zh=1792；改模型需重建 Milvus 集合
        dimension: 1792
  sse:
    timeout-ms: 1800000
  codebase:
    embedding-enabled: true
    # 本地 embedding-server（compose: embedding / 本机 :8008）
    embedding-api-key: local
    embedding-base-url: http://127.0.0.1:8008/v1
    embedding-model: Yuan-embedding-2.0-zh
    index-file: ${agent.data-dir}/workspace/.codebase-index.json
  browser:
    headless: true
  tools:
    # true=exec_command 免批（含 Ask 模式）；prod profile 仍为 false
    exec-enabled: true
    allow-absolute-write: false
    block-private-network: true
    # 同时执行的工具调用数上限
    max-concurrency: 8
    # 逐工具外层闸门覆盖（秒）。键 = 工具名；exec_command 不接受覆盖。
    timeout-overrides: {}
  execution:
    deadline-ms: 1800000
    max-tool-calls: 120
    # 本轮所有 LLM 调用 input+output 之和。须大于单次工作窗口，
    # 否则一轮肥请求就会「任务已耗尽 token 预算」。约 6～8 次满窗口调用。
    max-estimated-tokens: 2000000
    # 直跑循环上限（引擎封顶）。规划器节点上限仍是 planner.proposal-max-iterations。
    max-iterations: 90
    # delegate_task 内层循环上限
    subagent-max-iterations: 25
  rate-limit:
    per-minute: 60
  concurrency:
    max-tasks-per-user: 2
  quota:
    zone-id: ${AGENT_QUOTA_ZONE_ID:Asia/Shanghai}
  security:
    model-config-encryption-key: ${MODEL_CONFIG_ENCRYPTION_KEY:}
  multimodal:
    # MiMo Base64 串上限约 50MB → 源文件约 35MB
    audio-max-bytes: 36700160
    video-max-bytes: 36700160
    # 有图/音视频时改用该预设（default=MiMo v2.5）；空=沿用用户当前模型
    vision-preset: default
  todo:
    # db=多副本真相源（agent_session_todos）；file=仅本地 JSON
    storage: db
    persist-dir: ${agent.data-dir}/workspace/.todos
  # 生产级 Planner：GoalCompiler + PlanningLoop + Recovery（Todo/Trace 为投影）
  planner:
    enabled: true
    # db=多副本真相源（agent_session_planner）；file=本地 JSON；memory=仅进程内（勿用于扩容）
    storage: db
    persist-dir: ${agent.data-dir}/workspace/.planner
    max-recoveries: 3
    proposal-batch-size: 1
    proposal-max-iterations: 8
    proposal-browser-max-iterations: 16
    # 同一节点配额用尽后接着同一份 messages 再跑，最多这么多段
    proposal-max-chunks: 6
    compiler-retry: 1
    max-outer-rounds: 24
    hard-proposal: true
    strict-eval: true
    max-local-repair: 3
    max-replace-tool: 2
    max-rewrite-graph: 2
    max-revise-goal: 1
  # 流式中途预执行只读工具（onCompleteToolCall）
  streaming:
    prefetch-readonly: true
  # 会话累计 token 软预算（0=关闭）；超限后注入一次提醒，不硬杀
  token-budget:
    max-total: 0
  # MCP：启用后启动时连接 servers 并把 tools 注册为 mcp__{id}__{tool}
  # POST /api/mcp/refresh 可热更新 tools/list
  mcp:
    enabled: false
    servers: []
    # 示例：
    # servers:
    #   - id: filesystem
    #     transport: stdio
    #     command: npx
    #     args: ["-y", "@modelcontextprotocol/server-filesystem", "./workspace"]

