spring:
  # 机器相关配置与密钥放在仓库外，优先级高于本文件。
  # optional: 前缀 —— 文件不存在时不阻止启动，但依赖密钥的功能（联网搜索/生图等）会失败。
  # 模板见仓库根目录 config.example.yml；实际文件在 ${MINI_AGENT_HOME}/config.yml。
  config:
    import:
      - optional:file:${MINI_AGENT_HOME:${user.home}/.miniagent}/config.yml
  thymeleaf:
    cache: false   # 开发期关闭模板缓存：改完 .html 刷新页面即可生效，无需重启
  servlet:
    multipart:
      max-file-size: 1000MB
      max-request-size: 1000MB
      enabled: true
  application:
    name: mini-agent-springboot
  mvc:
    async:
      request-timeout: 1800000
  datasource:
    url: ${DB_URL:jdbc:mysql://127.0.0.1:3306/mini_agent?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai&characterEncoding=UTF-8}
    username: ${DB_USERNAME:root}
    # 默认值取自 docker-compose.yml 里 MYSQL_ROOT_PASSWORD 的默认值。
    # 原来兜底是空字符串，于是"没配"和"配成空"无法区分，报错落在 MySQL 握手的
    # "using password: NO"（看着像权限问题），而不是"缺配置"。
    # 需要覆盖时照旧用环境变量；prod 档是裸的 ${DB_PASSWORD}，生产不走这个默认值。
    password: ${DB_PASSWORD:mysql_root_pass}
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: 127.0.0.1
      port: 6379
      # 同上。docker-compose.yml 的 redis 已带 --requirepass（与之同源同默认值），
      # 所以这里兜底必须是同一个值：留空的话 Redis 会回 "NOAUTH Authentication required."，
      # 而 /actuator/health 只会显示 redis DOWN，看不出是密码没给。
      password: ${REDIS_PASSWORD:miniagent_redis_pass}
      timeout: 3s
  flyway:
    enabled: false
    # 两处来源：SQL 迁移（db/migration，V1~V8，MySQL 方言）与 Java 迁移
    # （com.miniagent.migration，V9 起，H2/MySQL 通用）。Java 迁移必须把包路径
    # 加进 locations —— Flyway 是拿 location 当包名扫描的，默认的
    # classpath:db/migration 扫不到 com.miniagent.migration 里的类。
    # prod 与 desktop 共用这条链，两边历史表的版本号因此始终对齐。
    locations: classpath:db/migration,classpath:com/miniagent/migration
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
    open-in-view: false

server:
  port: 8080
  tomcat:
    connection-timeout: 1800000
    max-http-form-post-size: 710MB
    max-http-request-header-size: 64KB
    # -1：拒绝超限请求时也把 body 读完再关连接。100MB 会在 700MB 上传途中把连接掐掉。
    max-swallow-size: -1

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when_authorized
  health:
    # local 默认不依赖 Redis；prod/redis 模式再开
    redis:
      enabled: false

# LangChain4j OpenAI 兼容客户端
langchain4j:
  open-ai:
    chat-model:
      # LLM_API_KEY 未设置时复用 MiMo 配置，避免对话和 Episode 提炼使用占位 Key。
      api-key: ${LLM_API_KEY:${image.gen.mimo-api-key:}}
      base-url: ${LLM_BASE_URL:https://token-plan-cn.xiaomimimo.com/v1}
      model-name: ${LLM_MODEL:mimo-v2.6-pro}
      timeout: 1200s
      returnThinking: true
      sendThinking: false
    streaming-chat-model:
      # 流式模型与普通模型保持同一套认证配置。
      api-key: ${LLM_API_KEY:${image.gen.mimo-api-key:}}
      base-url: ${LLM_BASE_URL:https://token-plan-cn.xiaomimimo.com/v1}
      model-name: ${LLM_MODEL:mimo-v2.6-pro}
      timeout: 1200s
      returnThinking: true
      sendThinking: false

# Agent 配置
agent:
  # 统一数据根（记忆/媒体/skills/workspace）。可用环境变量 MINI_AGENT_HOME 覆盖。
  # 默认：{user.home}/.miniagent ，不再写入项目仓库旁路目录。
  data-dir: ${MINI_AGENT_HOME:${user.home}/.miniagent}
  auth:
    # JWT HS256 签名密钥。旧名 cookie-secret —— cookie 通路已随无状态改造整体移除，
    # 但这份值一直在给 JWT 签名，名字留着会误导（以为还有个 cookie 在用）。
    # 仍接受 COOKIE_SECRET 回退，已部署环境不用改环境变量也能起来。
    jwt-secret: ${JWT_SECRET:${COOKIE_SECRET:local-dev-jwt-secret-not-for-production}}
    # JWT 方案：exp 仅为硬性上限；真实滑动超时由 Redis TTL 控制
    jwt-exp-seconds: 604800      # JWT 有效期上限（7 天），兜底用
    jwt-ttl-seconds: 1800       # Redis 滑动会话窗口（30 分钟），每次鉴权刷新
    registration-enabled: true
    password-min-length: 8
    bcrypt-strength: 10
    # CORS 白名单。生产用 ALLOWED_ORIGINS 覆盖（ProductionReadinessValidator 要求
    # 每一项都是精确 HTTPS origin，不能带 path/query/凭据）。
    # 不设该环境变量时退回下面这组本地 origin，dev 档行为不变。
    # desktop 档会显式钉死本地值，不吃这个变量 —— 见 application-desktop.yml。
    allowed-origins: ${ALLOWED_ORIGINS:http://localhost:*,http://127.0.0.1:*,file://}
  memory:
    # db=多副本真相源（agent_user_memory）；file=仅本地目录
    storage: db
    service:
      # local：桌面端默认同进程 H2/MySQL；remote：服务器 Agent 调用独立记忆服务。
      mode: ${MEMORY_SERVICE_MODE:local}
      base-url: ${MEMORY_SERVICE_BASE_URL:}
      internal-key: ${MEMORY_SERVICE_INTERNAL_KEY:}
      connect-timeout-ms: ${MEMORY_SERVICE_CONNECT_TIMEOUT_MS:3000}
      read-timeout-ms: ${MEMORY_SERVICE_READ_TIMEOUT_MS:10000}
    procedure:
      # remote 模式下把 SOP 版本投影到独立记忆服务的投递节奏（local 模式不启用）。
      # 投递失败按指数退避，10 次后留在 FAILED 等人工核对。
      outbox:
        interval-ms: ${MEMORY_PROCEDURE_OUTBOX_INTERVAL_MS:5000}
      governance:
        enabled: true
        # 至少有 10 个终态结算样本才判定，避免单次/少数失败被噪声触发
        min-attempts: 10
        # 达到样本数后，成功率 <= 20% 的 SOP 自动从 ACTIVE 候选归档
        archive-max-success-rate: 0.20
        # 候选自动采纳默认关闭；开启前必须接入独立验证者和审计策略
        automatic-acceptance-enabled: false
        minimum-independent-validations: 2
    vector:
      enabled: true
      # local=本机 InMemory+JSON；milvus=生产向量库（compose/prod）
      backend: local
      top-k: 6
      min-score: 0.4
      milvus:
        uri: http://127.0.0.1:19530
        token:
        # 结构化记忆：tenant_id/memory_id/content schema
        collection: agent_memory
        # 旧版用户 Blob 索引：user_id/text schema；必须与结构化集合物理隔离
        blob-collection: agent_memory_blob_v1
        # Yuan-embedding-2.0-zh=1792；改模型需重建 Milvus 集合
        dimension: 1792
  # 聊天模型预设（前端可选；空字段回退 langchain4j.open-ai.chat-model.*）
  models:
    default-preset: default
    presets:
      - id: default
        label: mimo-v2.6-pro
        # 厂商侧上下文窗口（token）。填了之后：循环按 min(此值, agent.context.max-tokens)
        # 决定何时压缩，前端"上下文已用 X%"也按这个分母显示。
        # 不填（0）= 未知，回退到 agent.context.max-tokens —— 但那样配小窗口模型时
        # 压缩会永不触发，上游以 context-length 400 拒绝，用户看到的是"模型连接异常"。
        # 同一模型按套餐开放多档时，用 supported-context-windows 列出各档，
        # 本字段作为默认档；选档规则见 ContextWindowResolver（与 WorkBuddy 一致：
        # 默认档落在候选集里就用它，否则取最小档）。
        context-window-tokens: 512000
        # supported-context-windows: [128000, 200000, 512000]
        # 厂商输入硬上限：高于它的档位不可能生效，会在选档前被过滤掉
        # max-input-tokens: 512000
      - id: chatanywhere
        label: ChatAnywhere
        base-url: https://api.chatanywhere.tech/v1
        model-name: gpt-4o-mini
        # gpt-4o-mini 的真实窗口是 128k：不声明的话它会继承 512k 的压缩阈值（永远不触发）。
        context-window-tokens: 128000
        api-key: ${CHATANYWHERE_API_KEY:}
  chat-memory:
    # 跨请求滑动窗口条数（非 token）。单轮 Loop 内由 context.max-tokens 压缩。
    max-messages: 64
  context:
    # 工作窗口**上限**（估算 token）。实际窗口取 min(此值, 预设的 context-window-tokens)：
    # 这里是一个全局天花板，不是"所有模型都按这个算"。
    max-tokens: 512000
    # 两档压缩阈值，语义与 WorkBuddy 的 preMessage / emergency 一致：
    #   pre-message  下一次请求前，上下文达到工作窗口的该比例就压缩（默认 0.5）；
    #   emergency    provider 真实 input 已达到该比例时无视冷却与「连续无效」护栏，
    #                避免请求进入上游必然拒绝的区间（默认 0.9）。
    # 触发依据取「本地估算」与「最近一次真实 inputTokenCount」的较大值，
    # 本地估算按 0.7/0.3 分 CJK/拉丁字符加权，与厂商分词有偏差，真实值用于校正。
    # 注意：日常任务每轮 prompt 几万 token，占 512k 窗口不到 10%，看不到压缩是正常的。
    pre-message-threshold: 0.5
    emergency-threshold: 0.9
    # true=压缩时同步调 LLM 摘要：任务在压缩期间暂停，摘要完成后再继续下一轮。
    # false=只做工程压缩（结构化交接 stub），LLM 摘要异步补，供下次压缩使用。
    llm-summary-enabled: true
    # 两步压缩的第二道判据：先做工程压缩（纯字符串重排，零成本），
    # 压缩后总量 ≤ 工作窗口 × 本比例就不再花一次 LLM 调用。
    # 0.15 与 WorkBuddy 的 getEngineeringCompactSufficiencyRatio() 默认值一致。
    engineering-sufficiency-ratio: 0.15
    budget:
      enabled: true
      chars-per-token: 2.0
      slot-tokens:
        identity: 2000
        authority: 400
        reference: 300
        memory: 6000
        skills: 2000
        reasoning: 1500
        tools: 4000
        todo: 2000
        closing: 1500
    history:
      # QUESTION 指代：相关度精捞最多保留条数（非盲目最近 N）
      question-with-ref: 6
      # 指代精捞：从会话末尾向前扫描的候选池大小
      ref-scan-max: 48
      # 弱代词指代时保底附带的最近消息条数
      ref-pronoun-anchor: 4
      # 指代精捞：写入时持久化会话向量；检索优先向量库，失败回退扫描窗/词重叠
      ref-vector-enabled: true
      ref-min-score: 0.35
      vector:
        # Milvus 集合名（backend 与 agent.memory.vector.backend 一致）
        collection: agent_session_history
  # local=单机不启 Redis 热存储/跨实例事件；redis=写穿热存储+任务并发+发布订阅（生产/compose）
  replica:
    mode: local
    todo-ttl-seconds: 86400
    memory-ttl-seconds: 86400
    planner-ttl-seconds: 86400
    run-lock-ttl-seconds: 7200
  sse:
    timeout-ms: 1800000
  observability:
    # 轨迹用于运行期排障和审计查询；聊天内容、任务状态和批准记录仍由各自
    # 的持久化表负责。定期按时间清理，避免高频 token/工具轨迹无限增长。
    trace-retention-days: 30
    trace-cleanup-interval-ms: 21600000
  codebase:
    embedding-enabled: true
    # remote    = OpenAI 兼容 HTTP（下面的 base-url）；local-onnx = 进程内跑 ONNX 图，
    #             不需要 embedding-server，也不需要任何外部 API。
    # desktop 档用 local-onnx（见 application-desktop.yml），prod/compose 档保持 remote。
    embedding-provider: remote
    # 本地 embedding-server（compose: embedding / 本机 :8008）
    embedding-api-key: local
    embedding-base-url: http://127.0.0.1:8008/v1
    embedding-model: Yuan-embedding-2.0-zh
    # embedding-provider=local-onnx 时才读这三项。
    # 出厂默认 int8（329,744,186 B，单文件）：体积是 fp16 的一半、fp32 的四分之一，
    # 且三者中最快；真实改写检索的 top-1 / top-3 / MRR 与 fp32 逐项相同。
    # 完整实测与已知退化面见 application-desktop.yml 的 codebase 段。
    # 注意 fp32 与 fp16 变体各带一个同名 .onnx.data 存权重，换用时必须一起放。
    #
    # 路径前缀用一个可覆盖变量：桌面壳会把随包的 resources/models 通过
    # MINI_AGENT_MODELS_DIR 传进来，不传时回退到 data-dir/models（开发态）。
    # 详见 application-desktop.yml 里同一段的说明。
    embedding-local-model: ${MINI_AGENT_MODELS_DIR:${agent.data-dir}/models}/yuan-embedding-2.0-zh.int8.onnx
    embedding-local-tokenizer: ${MINI_AGENT_MODELS_DIR:${agent.data-dir}/models}/tokenizer.json
    # ORT 是进程内线程池，不是请求级隔离；给太大时多路并发会互相抢核
    embedding-local-threads: 4
    index-file: ${agent.data-dir}/workspace/.codebase-index.json
  browser:
    headless: true
  permissions:
    # Ask approvals are exact tool+argument grants and expire automatically.
    ask-grant-ttl-seconds: 300
  tools:
    # 默认执行策略，三档：block=禁止 / ask=需会话批准 / allow=免批。
    # 安全基线是 ask：配置缺失或 profile 漏激活时，exec_command 仍需用户批准。
    # 会话内可用 PUT /api/conversations/{sid}/permission 的 execPolicy 字段覆盖（default 表示跟随这里）。
    # 命令级安全过滤（黑名单 / 危险模式 / 注入检测 / 常驻服务器拦截）不受本档位影响，永远生效。
    exec-policy: ask
    allow-absolute-write: false
    block-private-network: true
    # 同时执行的工具调用数上限
    max-concurrency: 8
    # 逐工具外层闸门覆盖（秒）。键 = 工具名；exec_command 不接受覆盖。
    timeout-overrides: {}
  execution:
    deadline-ms: 1800000
    max-tool-calls: 120
    # 单任务累计 token 的**告警线**，不是终止线。
    # 累计 token = Σ(每轮 input)，随任务时长线性增长；正常长任务与原地打转的死循环
    # 在这条线上长得一样，拿它当终止判据必然误杀长时间任务（旧行为：超过
    # max-estimated-tokens 直接结束，用户看到「任务已耗尽 token 预算」）。
    # 现在越线只写一条 TOKEN_USAGE_WARN 轨迹 + 一条 WARN 日志，任务继续跑完。
    # 真正拦失控的是下面三道，加上重复工具检测 —— 这四项都与工作量无关：
    #   deadline-ms（墙钟）、max-tool-calls（工具次数）、max-iterations（轮次）。
    token-soft-limit: 8000000
    # 直跑循环上限（引擎封顶）。规划器节点上限仍是 planner.proposal-max-iterations。
    max-iterations: 90
    # delegate_task 内层循环上限
    subagent-max-iterations: 25
  rate-limit:
    per-minute: 60
  concurrency:
    max-tasks-per-user: 2
  quota:
    zone-id: ${AGENT_QUOTA_ZONE_ID:Asia/Shanghai}
  security:
    model-config-encryption-key: ${MODEL_CONFIG_ENCRYPTION_KEY:}
  multimodal:
    # MiMo Base64 串上限约 50MB → 源文件约 35MB
    audio-max-bytes: 36700160
    video-max-bytes: 36700160
    # 有图/音视频时改用该预设（default=MiMo v2.5）；空=沿用用户当前模型
    vision-preset: default
  todo:
    # db=多副本真相源（agent_session_todos）；file=仅本地 JSON
    storage: db
    persist-dir: ${agent.data-dir}/workspace/.todos
  # 生产级 Planner：GoalCompiler + PlanningLoop + Recovery（Todo/Trace 为投影）
  planner:
    enabled: true
    # db=多副本真相源（agent_session_planner）；file=本地 JSON；memory=仅进程内（勿用于扩容）
    storage: db
    persist-dir: ${agent.data-dir}/workspace/.planner
    max-recoveries: 3
    proposal-batch-size: 1
    proposal-max-iterations: 8
    proposal-browser-max-iterations: 16
    # 同一节点配额用尽后接着同一份 messages 再跑，最多这么多段
    proposal-max-chunks: 6
    compiler-retry: 1
    max-outer-rounds: 24
    hard-proposal: true
    strict-eval: true
    max-local-repair: 3
    max-replace-tool: 2
    max-rewrite-graph: 2
    max-revise-goal: 1
  # 流式中途预执行只读工具（onCompleteToolCall）
  streaming:
    prefetch-readonly: true
  # 会话累计 token 软预算（0=关闭）；超限后注入一次提醒，不硬杀
  token-budget:
    max-total: 0
  # MCP：启用后启动时连接 servers 并把 tools 注册为 mcp__{id}__{tool}
  # POST /api/mcp/servers 或 /api/mcp/servers/{serverId} 可热更新 tools/list
  mcp:
    enabled: false
    servers: []
    # 示例：
    # servers:
    #   - id: filesystem
    #     transport: stdio
    #     command: npx
    #     args: ["-y", "@modelcontextprotocol/server-filesystem", "./workspace"]
    #     # MCP 进程是不可信边界：单帧与等待中的请求都有限额。
    #     max-frame-bytes: 8388608
    #     request-timeout-seconds: 120

logging:
  level:
    com.miniagent: DEBUG
    root: INFO

# Web 搜索配置（密钥见 ${MINI_AGENT_HOME}/config.yml，模板 config.example.yml）
web:
  search:
    backend:
    tavily-api-key: ${TAVILY_API_KEY:}
    bing-api-key: ${BING_API_KEY:}
    google-api-key: ${GOOGLE_API_KEY:}
    google-cse-id: ${GOOGLE_CSE_ID:}

# 图像生成配置（密钥见 ${MINI_AGENT_HOME}/config.yml，模板 config.example.yml）
image:
  gen:
    mimo-api-key: ${MIMO_API_KEY:}
    mimo-base-url: https://token-plan-cn.xiaomimimo.com/v1
    mimo-model: mimo-v2.6-pro
    chatanywhere-key: ${CHATANYWHERE_IMAGE_KEY:}
    chatanywhere-base-url: https://api.chatanywhere.tech/v1
    chatanywhere-model: gpt-image-2-ca
    # gpt-image-2-ca 慢，120s 必超时；500s≈8 分钟
    chatanywhere-timeout-seconds: 500
    # image_generate 的内层总预算（秒）：竞速段 + 降级尾巴 + 落盘都在这之内，
    # 到点工具自己强杀并返回已试后端清单（可控终态）。外层闸门 = 预算 + 30s，
    # 注册期自动派生进执行契约，无需另配。调大 chatanywhere-timeout-seconds 时同步调大它。
    total-budget-seconds: 540
    siliconflow-api-key: ${SILICONFLOW_API_KEY:}
    fal-key: ${FAL_KEY:}
    zhipu-api-key: ${ZHIPU_API_KEY:}

# 生歌（SenseAudio）。留空时回退到环境变量 SENSEAUDIO_API_KEY。
# 密钥不要提交进仓库，生产环境请用环境变量或密钥管理注入。
song:
  gen:
    senseaudio-key: ${SENSEAUDIO_API_KEY:}
    base-url: https://api.senseaudio.cn
    # Music 2.0 唯一可用模型（docs.senseaudio.cn）；旧值 sensesong 会 404
    model: senseaudio-music-2.0-260626

# MiniMax 音乐（国内 https://api.minimax.cn ）。密钥是开放平台接口密钥，
# 不是小米 MiMo 的 MIMO_API_KEY。文档：
# https://platform.minimaxi.com/docs/api-reference/music-generation
minimax:
  music:
    api-key: ${MINIMAX_API_KEY:}
    base-url: https://api.minimax.cn
    model: music-3.0

# Google Lyria 3.5（Gemini Interactions API）。密钥是 AI Studio 的 GEMINI_API_KEY，
# 不是 Custom Search 的 GOOGLE_API_KEY。文档：
# https://ai.google.dev/gemini-api/docs/music-generation
lyria:
  music:
    api-key: ${GEMINI_API_KEY:}
    base-url: https://generativelanguage.googleapis.com
    model: lyria-3.5

file:
  upload:
    # 已弃用：实际上传到 agent.data-dir/media/uploads（MediaStorage）
    base-dir: unused
    max-size: 734003200          # 700MB，与 spring.servlet.multipart.max-file-size 对齐
  extract:
    max-bytes: 52428800          # 单文件原始大小上限 50MB
    max-inline-chars: 80000      # 单文件提取后内联截断
    max-context-chars: 120000    # 多附件合计注入上下文预算
    sidecar-threshold-chars: 20000  # 超过则写 .extracted.txt 侧车
