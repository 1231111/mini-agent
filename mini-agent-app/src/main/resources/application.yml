spring:
  profiles:
    # Production is the safe implicit mode. Local development must opt into
    # `dev` explicitly; otherwise a forgotten profile would bypass readiness
    # validation and silently start with development defaults.
    default: prod
  # 机器相关配置与密钥放在仓库外，优先级高于本文件。
  # optional: 前缀 —— 文件不存在时不阻止启动，但依赖密钥的功能（联网搜索/生图等）会失败。
  # 模板见仓库根目录 config.example.yml；实际文件在 ${MINI_AGENT_HOME}/config.yml。
  config:
    import:
      - optional:file:${MINI_AGENT_HOME:${user.home}/.miniagent}/config.yml
  thymeleaf:
    cache: true    # 生产形态：模板缓存常开，改模板需重启；开发用 dev 档关闭
  servlet:
    multipart:
      max-file-size: 100MB
      # Leave room for encoding/metadata around a 100MB decoded upload.
      max-request-size: 140MB
      enabled: true
  application:
    name: mini-agent-springboot
  lifecycle:
    # Agent/SSE hard deadline is 30 minutes; allow five extra minutes for final
    # persistence and stream completion after admission has stopped.
    timeout-per-shutdown-phase: ${SERVER_SHUTDOWN_TIMEOUT:35m}
  mvc:
    async:
      request-timeout: 1800000
  datasource:
    # The secure default is intentional. Local development overrides this in
    # application-dev.yml; production still requires an explicit DB_URL and a
    # trusted server certificate through the readiness validator.
    url: ${DB_URL:jdbc:mysql://127.0.0.1:3306/mini_agent?sslMode=VERIFY_IDENTITY&serverTimezone=Asia/Shanghai&characterEncoding=UTF-8}
    username: ${DB_USERNAME:root}
    # 密码只从环境变量或外部 config.yml 注入；固定的本地开发值仅在 application-dev.yml。
    # prod profile 校验实际解析后的口令，拒绝缺失、短值和曾提交的开发口令。
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: 127.0.0.1
      port: 6379
      # Redis 密码从环境变量或外部 config.yml 注入；固定的本地开发值仅在 application-dev.yml。
      password: ${REDIS_PASSWORD:}
      timeout: 3s
  flyway:
    enabled: true
    baseline-on-migrate: true
    clean-disabled: true
    out-of-order: false
    # 两处来源：SQL 迁移（db/migration，V1~V8，MySQL 方言）与 Java 迁移
    # （com.miniagent.migration，V9 起，H2/MySQL 通用）。Java 迁移必须把包路径
    # 加进 locations —— Flyway 是拿 location 当包名扫描的，默认的
    # classpath:db/migration 扫不到 com.miniagent.migration 里的类。
    # prod 与 desktop 共用这条链，两边历史表的版本号因此始终对齐。
    locations: classpath:db/migration,classpath:com/miniagent/migration
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
    open-in-view: false

server:
  port: 8080
  shutdown: graceful
  tomcat:
    connection-timeout: 1800000
    max-http-form-post-size: 140MB
    max-http-request-header-size: 64KB
    # 限制拒绝请求时最多 drain 的 body，避免 -1 对超大恶意请求无界读取。
    max-swallow-size: 140MB

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db,redis
        liveness:
          include: livenessState
  health:
    redis:
      enabled: true
    readinessstate:
      enabled: true
    livenessstate:
      enabled: true

# LangChain4j OpenAI 兼容客户端
langchain4j:
  open-ai:
    chat-model:
      # LLM_API_KEY 未设置时直接复用外部 config.yml 的 MIMO_API_KEY。
      # 不通过 image.gen 间接引用，避免生产校验和聊天客户端看到不同的配置链路。
      api-key: ${LLM_API_KEY:${MIMO_API_KEY:}}
      base-url: ${LLM_BASE_URL:https://token-plan-cn.xiaomimimo.com/v1}
      model-name: ${LLM_MODEL:mimo-v2.6-pro}
      timeout: 1200s
      returnThinking: true
      sendThinking: false
    streaming-chat-model:
      # 流式模型与普通模型保持同一套认证配置。
      api-key: ${LLM_API_KEY:${MIMO_API_KEY:}}
      base-url: ${LLM_BASE_URL:https://token-plan-cn.xiaomimimo.com/v1}
      model-name: ${LLM_MODEL:mimo-v2.6-pro}
      timeout: 1200s
      returnThinking: true
      sendThinking: false

# Agent 配置
memory:
  service:
    security:
      # App 仅需装配该配置类型；独立 memory-service 的写接口仍由自身 profile 暴露。
      internal-key: ${MEMORY_SERVICE_INTERNAL_KEY:}
      runner-key: ${MEMORY_SERVICE_RUNNER_KEY:}
      router-key: ${MEMORY_SERVICE_ROUTER_KEY:}
      attestation-max-age-seconds: ${MEMORY_SERVICE_ATTESTATION_MAX_AGE_SECONDS:300}
  evolution:
    # App 作为执行侧依赖该配置类型；自动演进决策仍由独立 memory-service 发起。
    enabled: ${MEMORY_EVOLUTION_ENABLED:false}
    minimum-samples: ${MEMORY_EVOLUTION_MINIMUM_SAMPLES:20}
    maximum-baseline-failure-rate: ${MEMORY_EVOLUTION_MAX_BASELINE_FAILURE_RATE:0.5}
    minimum-improvement: ${MEMORY_EVOLUTION_MINIMUM_IMPROVEMENT:0.05}
    canary-percent: ${MEMORY_EVOLUTION_CANARY_PERCENT:5}
    minimum-canary-samples: ${MEMORY_EVOLUTION_MINIMUM_CANARY_SAMPLES:100}
    rollback-failure-rate: ${MEMORY_EVOLUTION_ROLLBACK_FAILURE_RATE:0.25}

agent:
  # 统一数据根（记忆/媒体/skills/workspace）。可用环境变量 MINI_AGENT_HOME 覆盖。
  # 默认：{user.home}/.miniagent ，不再写入项目仓库旁路目录。
  data-dir: ${MINI_AGENT_HOME:${user.home}/.miniagent}
  chat:
    # Bound JSON bodies before Jackson allocates inline images/files and DTO lists.
    max-json-request-bytes: ${CHAT_MAX_JSON_REQUEST_BYTES:33554432}
  auth:
    # JWT HS256 签名密钥。旧名 cookie-secret —— cookie 通路已随无状态改造整体移除，
    # 但这份值一直在给 JWT 签名，名字留着会误导（以为还有个 cookie 在用）。
    # prod profile 要显式配置强密钥；仍接受旧变量 COOKIE_SECRET 作为兼容别名。
    jwt-secret: ${JWT_SECRET:${COOKIE_SECRET:}}
    # JWT 方案：exp 仅为硬性上限；真实滑动超时由 Redis TTL 控制
    jwt-exp-seconds: 604800      # JWT 有效期上限（7 天），兜底用
    jwt-ttl-seconds: 1800       # Redis 滑动会话窗口（30 分钟），每次鉴权刷新
    registration-enabled: false
    password-min-length: 12
    bcrypt-strength: 12
    # CORS 白名单。生产用 ALLOWED_ORIGINS 覆盖（ProductionReadinessValidator 要求
    # 每一项都是精确 HTTPS origin，不能带 path/query/凭据）。
    # 不设该环境变量时退回下面这组本地 origin，dev 档行为不变。
    # desktop 档会显式钉死本地值，不吃这个变量 —— 见 application-desktop.yml。
    allowed-origins: ${ALLOWED_ORIGINS:http://localhost:*,http://127.0.0.1:*,file://}
    cloud:
      # 账号与会员由独立服务承担（mini-agent-account，默认 127.0.0.1:8081）。
      base-url: ${ACCOUNT_BASE_URL:http://127.0.0.1:8081}
      # 云端 agent 与账号服务共用同一个 MySQL 库，账号行就是本机行。
      # 置 false 会让 ShadowUserService 为每个账号再插一条影子行 —— 同一人两条记录，
      # 且会员配额写在账号的租户上、agent 读影子行的租户，表现是"买了会员额度不变"。
      shared-database: true
      # 服务间密钥。账号服务侧读的是同一个环境变量名，两处必须完全一致。
      internal-key: ${ACCOUNT_INTERNAL_KEY:}
      connect-timeout-ms: 4000
      read-timeout-ms: 8000
      # 公网到云端是间歇性劣化的：同一个地址可能上一秒 40 ms、下一秒 SYN 丢包。
      # 3 秒硬超时会把本来能成功的登录直接判死（AUTH.03.01），所以给有限次重试。
      # 只对"连不上/超时"重试；4xx/5xx 与解析失败一律不重试。
      max-attempts: 3
      # 第 n 次失败后等 retry-backoff-ms × n（400 ms、800 ms）。
      retry-backoff-ms: 400
      # 退避 + 重试的总时间上限。登录在启动路径上阻塞，不能无限等。
      total-budget-ms: 20000
      membership:
        # False by default. Use only with the account service's matching demo flag enabled.
        simulated-payment-enabled: ${ACCOUNT_SIMULATED_PAYMENT_ENABLED:false}
  memory:
    # db=多副本真相源（agent_user_memory）；file=仅本地目录
    storage: db
    events:
      # processed event rows back durable Episodes; retain a bounded 90-day operational history.
      retention-days: ${MEMORY_EVENT_RETENTION_DAYS:90}
      purge-batches-per-run: ${MEMORY_EVENT_PURGE_BATCHES_PER_RUN:20}
      purge-cron: ${MEMORY_EVENT_PURGE_CRON:0 15 3 * * *}
    service:
      # 本地记忆保持可用；配置 memory-service 地址后，云端访问使用 Account 签发的用户凭证。
      mode: ${MEMORY_SERVICE_MODE:local}
      sync-interval-ms: ${MEMORY_SERVICE_SYNC_INTERVAL_MS:15000}
      base-url: ${MEMORY_SERVICE_BASE_URL:}
      connect-timeout-ms: ${MEMORY_SERVICE_CONNECT_TIMEOUT_MS:3000}
      read-timeout-ms: ${MEMORY_SERVICE_READ_TIMEOUT_MS:10000}
      # 云端读超时。规划只读本库。
      context-timeout-ms: ${MEMORY_SERVICE_CONTEXT_TIMEOUT_MS:300}
      fallback-ttl-hours: ${MEMORY_SERVICE_FALLBACK_TTL_HOURS:6}
      # 结果事件携带的环境版本；换规划模型/工具 schema 时由运维改并登记到 memory-service。
      env-version: ${MEMORY_SERVICE_ENV_VERSION:}
    outcome-outbox:
      interval-ms: ${MEMORY_OUTCOME_OUTBOX_INTERVAL_MS:2000}
      batch-size: ${MEMORY_OUTCOME_OUTBOX_BATCH_SIZE:500}
    procedure:
      governance:
        enabled: true
        # 至少有 10 个终态结算样本才判定，避免单次/少数失败被噪声触发
        min-attempts: 10
        # 达到样本数后，成功率 <= 20% 的 SOP 自动从 ACTIVE 候选归档
        archive-max-success-rate: 0.20
        # 候选自动采纳默认关闭；开启前必须接入独立验证者和审计策略
        automatic-acceptance-enabled: false
        minimum-independent-validations: 2
    vector:
      enabled: true
      # local=本机 InMemory+JSON；milvus=生产向量库（compose/prod）
      backend: milvus
      top-k: 6
      min-score: 0.4
      milvus:
        uri: http://127.0.0.1:19530
        token:
        # 结构化记忆：tenant_id/memory_id/content schema
        collection: agent_memory
        # 旧版用户 Blob 索引：user_id/text schema；必须与结构化集合物理隔离
        blob-collection: agent_memory_blob_v1
        # Yuan-embedding-2.0-zh=1792；改模型需重建 Milvus 集合
        dimension: 1792
  # 聊天模型预设（前端可选；空字段回退 langchain4j.open-ai.chat-model.*）
  models:
    default-preset: default
    # 生产形态：禁止用户自定义 base-url（否则可把请求指向任意主机）。
    custom-base-url-enabled: false
    presets:
      - id: default
        label: mimo-v2.6-pro
        # 厂商侧上下文窗口（token）。填了之后：循环按 min(此值, agent.context.max-tokens)
        # 决定何时压缩，前端"上下文已用 X%"也按这个分母显示。
        # 不填（0）= 未知，回退到 agent.context.max-tokens —— 但那样配小窗口模型时
        # 压缩会永不触发，上游以 context-length 400 拒绝，用户看到的是"模型连接异常"。
        # 同一模型按套餐开放多档时，用 supported-context-windows 列出各档，
        # 本字段作为默认档；选档规则见 ContextWindowResolver（与 WorkBuddy 一致：
        # 默认档落在候选集里就用它，否则取最小档）。
        context-window-tokens: 512000
        # supported-context-windows: [128000, 200000, 512000]
        # 厂商输入硬上限：高于它的档位不可能生效，会在选档前被过滤掉
        # max-input-tokens: 512000
      - id: chatanywhere
        label: ChatAnywhere
        base-url: https://api.chatanywhere.tech/v1
        model-name: gpt-4o-mini
        # gpt-4o-mini 的真实窗口是 128k：不声明的话它会继承 512k 的压缩阈值（永远不触发）。
        context-window-tokens: 128000
        api-key: ${CHATANYWHERE_API_KEY:}
  chat-memory:
    # 跨请求滑动窗口条数（非 token）。单轮 Loop 内由 context.max-tokens 压缩。
    max-messages: 64
  context:
    # 工作窗口**上限**（估算 token）。实际窗口取 min(此值, 预设的 context-window-tokens)：
    # 这里是一个全局天花板，不是"所有模型都按这个算"。
    max-tokens: 512000
    # 两档压缩阈值，语义与 WorkBuddy 的 preMessage / emergency 一致：
    #   pre-message  下一次请求前，上下文达到工作窗口的该比例就压缩（默认 0.5）；
    #   emergency    provider 真实 input 已达到该比例时无视冷却与「连续无效」护栏，
    #                避免请求进入上游必然拒绝的区间（默认 0.9）。
    # 触发依据取「本地估算」与「最近一次真实 inputTokenCount」的较大值，
    # 本地估算按 0.7/0.3 分 CJK/拉丁字符加权，与厂商分词有偏差，真实值用于校正。
    # 注意：日常任务每轮 prompt 几万 token，占 512k 窗口不到 10%，看不到压缩是正常的。
    pre-message-threshold: 0.5
    emergency-threshold: 0.9
    # true=压缩时同步调 LLM 摘要：任务在压缩期间暂停，摘要完成后再继续下一轮。
    # false=只做工程压缩（结构化交接 stub），LLM 摘要异步补，供下次压缩使用。
    llm-summary-enabled: true
    # 两步压缩的第二道判据：先做工程压缩（纯字符串重排，零成本），
    # 压缩后总量 ≤ 工作窗口 × 本比例就不再花一次 LLM 调用。
    # 0.15 与 WorkBuddy 的 getEngineeringCompactSufficiencyRatio() 默认值一致。
    engineering-sufficiency-ratio: 0.15
    budget:
      enabled: true
      chars-per-token: 2.0
      slot-tokens:
        identity: 2000
        authority: 400
        reference: 300
        memory: 6000
        skills: 2000
        reasoning: 1500
        tools: 4000
        todo: 2000
        closing: 2400
    history:
      # QUESTION 指代：相关度精捞最多保留条数（非盲目最近 N）
      question-with-ref: 6
      # 指代精捞：从会话末尾向前扫描的候选池大小
      ref-scan-max: 48
      # 弱代词指代时保底附带的最近消息条数
      ref-pronoun-anchor: 4
      # 指代精捞：写入时持久化会话向量；检索优先向量库，失败回退扫描窗/词重叠
      ref-vector-enabled: true
      ref-min-score: 0.35
      vector:
        # Milvus 集合名（backend 与 agent.memory.vector.backend 一致）
        collection: agent_session_history
  # local=单机不启 Redis 热存储/跨实例事件；redis=写穿热存储+任务并发+发布订阅（生产/compose）
  replica:
    mode: redis
    todo-ttl-seconds: 86400
    memory-ttl-seconds: 86400
    planner-ttl-seconds: 86400
    run-lock-ttl-seconds: 7200
  sse:
    timeout-ms: 1800000
  observability:
    # 轨迹用于运行期排障和审计查询；聊天内容、任务状态和批准记录仍由各自
    # 的持久化表负责。定期按时间清理，避免高频 token/工具轨迹无限增长。
    trace-retention-days: 30
    trace-cleanup-interval-ms: 21600000
  codebase:
    embedding-enabled: true
    # remote    = OpenAI 兼容 HTTP（下面的 base-url）；local-onnx = 进程内跑 ONNX 图，
    #             不需要 embedding-server，也不需要任何外部 API。
    # desktop 档用 local-onnx（见 application-desktop.yml），prod/compose 档保持 remote。
    embedding-provider: remote
    # 本地 embedding-server（compose: embedding / 本机 :8008）
    embedding-api-key: local
    embedding-base-url: http://127.0.0.1:8008/v1
    embedding-model: Yuan-embedding-2.0-zh
    # embedding-provider=local-onnx 时才读这三项。
    # 出厂默认 int8（329,744,186 B，单文件）：体积是 fp16 的一半、fp32 的四分之一，
    # 且三者中最快；真实改写检索的 top-1 / top-3 / MRR 与 fp32 逐项相同。
    # 完整实测与已知退化面见 application-desktop.yml 的 codebase 段。
    # 注意 fp32 与 fp16 变体各带一个同名 .onnx.data 存权重，换用时必须一起放。
    #
    # 路径前缀用一个可覆盖变量：桌面壳会把随包的 resources/models 通过
    # MINI_AGENT_MODELS_DIR 传进来，不传时回退到 data-dir/models（开发态）。
    # 详见 application-desktop.yml 里同一段的说明。
    embedding-local-model: ${MINI_AGENT_MODELS_DIR:${agent.data-dir}/models}/yuan-embedding-2.0-zh.int8.onnx
    embedding-local-tokenizer: ${MINI_AGENT_MODELS_DIR:${agent.data-dir}/models}/tokenizer.json
    # ORT 是进程内线程池，不是请求级隔离；给太大时多路并发会互相抢核
    embedding-local-threads: 4
    index-file: ${agent.data-dir}/workspace/.codebase-index.json
  browser:
    headless: true
    evaluate-enabled: false
  permissions:
    # Ask approvals are exact tool+argument grants and expire automatically.
    ask-grant-ttl-seconds: 300
  action-journal:
    # Confirmed receipts remain available to prevent stale task replay; unresolved
    # RUNNING/UNKNOWN barriers are never purged regardless of this retention period.
    terminal-retention-days: 3650
    purge-cron: "0 20 3 * * *"
  tools:
    # 默认执行策略，三档：block=禁止 / ask=需会话批准 / allow=免批。
    # 基础 profile 默认 block；dev 与 desktop profile 显式改为 ask。
    # prod profile 校验会要求 block，直到命令隔离 worker 完成并验收。
    # 会话内可用 PUT /api/conversations/{sid}/permission 的 execPolicy 字段覆盖（default 表示跟随这里）。
    # 命令级安全过滤（黑名单 / 危险模式 / 注入检测 / 常驻服务器拦截）不受本档位影响，永远生效。
    exec-policy: block
    allow-absolute-write: false
    # 出站只允许标准端口，且跳转次数受限，避免被用来做端口扫描/绕过 SSRF 拦截。
    allowed-http-ports: 80,443
    max-http-redirects: 3
    block-private-network: true
    # 同时执行的工具调用数上限
    max-concurrency: 8
    # 单轮最多抓取的网页原文数；0 表示不限制。新闻/资料查询默认只核验少量高相关来源。
    max-web-extract-calls: 3
    # 逐工具外层闸门覆盖（秒）。键 = 工具名；exec_command 不接受覆盖。
    timeout-overrides: {}
  execution:
    deadline-ms: 1800000
    max-tool-calls: 120
    # 单任务累计 token 的**告警线**，不是终止线。
    # 累计 token = Σ(每轮 input)，随任务时长线性增长；正常长任务与原地打转的死循环
    # 在这条线上长得一样，拿它当终止判据必然误杀长时间任务（旧行为：超过
    # max-estimated-tokens 直接结束，用户看到「任务已耗尽 token 预算」）。
    # 现在越线只写一条 TOKEN_USAGE_WARN 轨迹 + 一条 WARN 日志，任务继续跑完。
    # 真正拦失控的是下面三道，加上重复工具检测 —— 这四项都与工作量无关：
    #   deadline-ms（墙钟）、max-tool-calls（工具次数）、max-iterations（轮次）。
    token-soft-limit: 8000000
    # 直跑循环上限（引擎封顶）。规划器节点上限仍是 planner.proposal-max-iterations。
    max-iterations: 90
    # delegate_task 内层循环上限
    subagent-max-iterations: 25
  rate-limit:
    per-minute: 30
    # UI 的任务状态/检查器刷新单独计数，避免历史会话轮询耗尽交互请求额度。
    background-read-per-minute: 180
    # 只有部署在反向代理后且已明确配置代理 CIDR 时，才信任 X-Forwarded-For。
    trusted-proxies: ${RATE_LIMIT_TRUSTED_PROXIES:}
  concurrency:
    max-tasks-per-user: 2
  quota:
    zone-id: ${AGENT_QUOTA_ZONE_ID:Asia/Shanghai}
    self-hosted-default-daily-token-limit: ${AGENT_SELF_HOSTED_DAILY_TOKEN_LIMIT:1000000}
    self-hosted-default-daily-user-token-limit: ${AGENT_SELF_HOSTED_DAILY_USER_TOKEN_LIMIT:100000}
  security:
    model-config-encryption-key: ${MODEL_CONFIG_ENCRYPTION_KEY:}
  multimodal:
    # MiMo Base64 串上限约 50MB → 源文件约 35MB
    audio-max-bytes: 36700160
    video-max-bytes: 36700160
    # 有图/音视频时改用该预设（default=MiMo v2.5）；空=沿用用户当前模型
    vision-preset: default
  todo:
    # db=多副本真相源（agent_session_todos）；file=仅本地 JSON
    storage: db
    persist-dir: ${agent.data-dir}/workspace/.todos
  # 生产级 Planner：GoalCompiler + PlanningLoop + Recovery（Todo/Trace 为投影）
  planner:
    enabled: true
    # 按执行依赖与验收需求由模型选择 DAG，与工具权限模式独立。
    auto-planning: true
    # db=多副本真相源（agent_session_planner）；file=本地 JSON；memory=仅进程内（勿用于扩容）
    storage: db
    persist-dir: ${agent.data-dir}/workspace/.planner
    max-recoveries: 3
    # 兼容配置。执行器目前只有单节点结果/证据，PlanningLoop 实际固定为 1。
    # 节点内部工具仍按工具并发策略执行。
    proposal-batch-size: 1
    proposal-max-iterations: 8
    proposal-browser-max-iterations: 16
    # 同一节点配额用尽后接着同一份 messages 再跑，最多这么多段
    proposal-max-chunks: 6
    compiler-retry: 1
    max-outer-rounds: 24
    hard-proposal: true
    max-local-repair: 3
    max-replace-tool: 2
    max-rewrite-graph: 2
    max-revise-goal: 1
  # 流式中途预执行只读工具（onCompleteToolCall）
  streaming:
    prefetch-readonly: true
  # 会话累计 token 软预算（0=关闭）；超限后注入一次提醒，不硬杀
  token-budget:
    max-total: 0
  # MCP：启用后启动时连接 servers 并把 tools 注册为 mcp__{id}__{tool}。
  # 每个 server 必须显式列出 allowed-tools 中的远端工具名；缺失或与 tools/list 不一致时整台服务器拒绝注册。
  # POST /api/mcp/servers 或 /api/mcp/servers/{serverId} 可热更新 tools/list
  mcp:
    enabled: false
    auto-reconnect-enabled: true
    max-reconnect-attempts: 3
    reconnect-window-seconds: 900
    health-check-interval-ms: 30000
    servers: []
    # 示例：
    # servers:
    #   - id: filesystem
    #     transport: stdio
    #     command: C:/Program Files/nodejs/npx.cmd
    #     # 与 command 必须指向同一个允许启动的绝对可执行文件；缺失时子进程不会启动。
    #     allowed-executable: C:/Program Files/nodejs/npx.cmd
    #     args: ["-y", "@modelcontextprotocol/server-filesystem", "./workspace"]
    #     # 精确的远端 MCP 工具名白名单；空列表会在启动子进程前禁用该 server。
    #     allowed-tools: ["read_file", "list_directory"]
    #     # 凭据只通过此 server 的 env 显式传入，不继承 agent 主进程密钥。
    #     env: {}
    #     # MCP 进程是不可信边界：单帧与等待中的请求都有限额。
    #     max-frame-bytes: 8388608
    #     request-timeout-seconds: 120

logging:
  level:
    com.miniagent: INFO
    root: WARN

# Web 搜索配置（密钥见 ${MINI_AGENT_HOME}/config.yml，模板 config.example.yml）
web:
  search:
    backend:
    time-zone: ${MINI_AGENT_TIME_ZONE:Asia/Shanghai}
    tavily-api-key: ${TAVILY_API_KEY:}
    bing-api-key: ${BING_API_KEY:}
    google-api-key: ${GOOGLE_API_KEY:}
    google-cse-id: ${GOOGLE_CSE_ID:}
    # 可选的付费降级。仅在当前搜索/抓取提供方失败或无有效结果时调用。
    deepseek-api-key: ${DEEPSEEK_API_KEY:}
    deepseek-base-url: ${DEEPSEEK_API_BASE_URL:https://api.deepseek.com}

# 图像生成配置（密钥见 ${MINI_AGENT_HOME}/config.yml，模板 config.example.yml）
image:
  gen:
    mimo-api-key: ${MIMO_API_KEY:}
    mimo-base-url: https://token-plan-cn.xiaomimimo.com/v1
    mimo-model: mimo-v2.6-pro
    chatanywhere-key: ${CHATANYWHERE_IMAGE_KEY:}
    chatanywhere-base-url: https://api.chatanywhere.tech/v1
    chatanywhere-model: gpt-image-2-ca
    # gpt-image-2-ca 慢，120s 必超时；500s≈8 分钟
    chatanywhere-timeout-seconds: 500
    # image_generate 的内层总预算（秒）：竞速段 + 降级尾巴 + 落盘都在这之内，
    # 到点工具自己强杀并返回已试后端清单（可控终态）。外层闸门 = 预算 + 30s，
    # 注册期自动派生进执行契约，无需另配。调大 chatanywhere-timeout-seconds 时同步调大它。
    total-budget-seconds: 540
    siliconflow-api-key: ${SILICONFLOW_API_KEY:}
    fal-key: ${FAL_KEY:}
    zhipu-api-key: ${ZHIPU_API_KEY:}

# 生歌（SenseAudio）。留空时回退到环境变量 SENSEAUDIO_API_KEY。
# 密钥不要提交进仓库，生产环境请用环境变量或密钥管理注入。
song:
  gen:
    senseaudio-key: ${SENSEAUDIO_API_KEY:}
    base-url: https://api.senseaudio.cn
    # Music 2.0 唯一可用模型（docs.senseaudio.cn）；旧值 sensesong 会 404
    model: senseaudio-music-2.0-260626

# MiniMax 音乐（国内 https://api.minimax.cn ）。密钥是开放平台接口密钥，
# 不是小米 MiMo 的 MIMO_API_KEY。文档：
# https://platform.minimaxi.com/docs/api-reference/music-generation
minimax:
  music:
    api-key: ${MINIMAX_API_KEY:}
    base-url: https://api.minimax.cn
    model: music-3.0

# Google Lyria 3.5（Gemini Interactions API）。密钥是 AI Studio 的 GEMINI_API_KEY，
# 不是 Custom Search 的 GOOGLE_API_KEY。文档：
# https://ai.google.dev/gemini-api/docs/music-generation
lyria:
  music:
    api-key: ${GEMINI_API_KEY:}
    base-url: https://generativelanguage.googleapis.com
    model: lyria-3.5

file:
  upload:
    # 已弃用：实际上传到 agent.data-dir/media/uploads（MediaStorage）
    base-dir: unused
    max-size: 104857600          # 100MB，与 spring.servlet.multipart.max-file-size 对齐
    antivirus:
      # Production profile overrides required=true and enables a configured scanner.
      enabled: ${FILE_UPLOAD_ANTIVIRUS_ENABLED:false}
      required: ${FILE_UPLOAD_ANTIVIRUS_REQUIRED:false}
      host: ${FILE_UPLOAD_ANTIVIRUS_HOST:127.0.0.1}
      port: ${FILE_UPLOAD_ANTIVIRUS_PORT:3310}
      timeout-ms: ${FILE_UPLOAD_ANTIVIRUS_TIMEOUT_MS:10000}
      chunk-bytes: ${FILE_UPLOAD_ANTIVIRUS_CHUNK_BYTES:1048576}
  extract:
    max-bytes: 52428800          # 单文件原始大小上限 50MB
    max-inline-chars: 80000      # 单文件提取后内联截断
    max-context-chars: 120000    # 多附件合计注入上下文预算
    sidecar-threshold-chars: 20000  # 超过则写 .extracted.txt 侧车
