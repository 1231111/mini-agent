spring:
  thymeleaf:
    cache: false   # 开发期关闭模板缓存：改完 .html 刷新页面即可生效，无需重启
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB
      enabled: true
  application:
    name: mini-agent-springboot
  mvc:
    async:
      request-timeout: 1800000
  datasource:
    url: jdbc:mysql://127.0.0.1:3306/mini_agent?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai&characterEncoding=UTF-8
    username: root
    password: mysql_root_pass
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
    open-in-view: false

server:
  port: 8080
  tomcat:
    connection-timeout: 1800000
    max-http-request-header-size: 64KB
    max-swallow-size: 64MB

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when_authorized

# LangChain4j OpenAI 兼容客户端
langchain4j:
  open-ai:
    chat-model:
      api-key: tp-c9w1dsoho0uhtzdzmndf2a89pmzos44uut4za8rt2wkatxuc
      base-url: https://token-plan-cn.xiaomimimo.com/v1
      model-name: mimo-v2.5
      timeout: 1200s
      returnThinking: true
      sendThinking: false
    streaming-chat-model:
      api-key: tp-c9w1dsoho0uhtzdzmndf2a89pmzos44uut4za8rt2wkatxuc
      base-url: https://token-plan-cn.xiaomimimo.com/v1
      model-name: mimo-v2.5
      timeout: 1200s
      returnThinking: true
      sendThinking: false

# Agent 配置
agent:
  auth:
    cookie-secret: miniagent-dev-cookie-secret-change-if-needed!!
    cookie-max-age-seconds: 604800
  chat-memory:
    max-messages: 24
  context:
    max-tokens: 256000
    compress-threshold: 0.75
  memory:
    vector:
      enabled: true
      top-k: 6
      min-score: 0.4
  sse:
    timeout-ms: 1800000
  codebase:
    embedding-enabled: true
    embedding-api-key: sk-S5B6jjx0B3yMvxLAojE3Y94yxOzQUj7FmZFO8UTaFWcsDyby
    embedding-base-url: https://api.chatanywhere.tech/v1
    embedding-model: BAAI/bge-m3
    index-file: ./workspace/.codebase-index.json
  tools:
    exec-enabled: false
    allow-absolute-write: false
    block-private-network: true
  rate-limit:
    per-minute: 60
  concurrency:
    max-tasks-per-user: 2
  todo:
    persist-dir: ./workspace/.todos

logging:
  level:
    com.miniagent: DEBUG
    root: INFO

# Web 搜索配置
