<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini Agent - Login</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #212121;
            color: #ececec;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .login-container {
            background: #2f2f2f;
            border-radius: 16px;
            padding: 40px;
            width: 380px;
            box-shadow: 0 4px 24px rgba(0,0,0,0.4);
        }
        .logo {
            text-align: center;
            margin-bottom: 32px;
        }
        .logo-icon {
            width: 56px;
            height: 56px;
            background: linear-gradient(135deg, #10a37f, #1a7f64);
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            margin-bottom: 12px;
        }
        .logo h1 {
            font-size: 22px;
            font-weight: 600;
        }
        .tabs {
            display: flex;
            margin-bottom: 24px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }
        .tab {
            flex: 1;
            padding: 10px;
            text-align: center;
            cursor: pointer;
            font-size: 15px;
            color: #8e8ea0;
            border-bottom: 2px solid transparent;
            transition: all 0.2s;
        }
        .tab.active {
            color: #10a37f;
            border-bottom-color: #10a37f;
        }
        .form-group {
            margin-bottom: 16px;
        }
        .form-group label {
            display: block;
            font-size: 13px;
            color: #8e8ea0;
            margin-bottom: 6px;
        }
        .form-group input {
            width: 100%;
            padding: 10px 14px;
            background: #212121;
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 8px;
            color: #ececec;
            font-size: 15px;
            outline: none;
            transition: border-color 0.2s;
        }
        .form-group input:focus {
            border-color: #10a37f;
        }
        .submit-btn {
            width: 100%;
            padding: 12px;
            background: #10a37f;
            border: none;
            border-radius: 8px;
            color: white;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
            margin-top: 8px;
        }
        .submit-btn:hover {
            background: #0e906f;
        }
        .submit-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .error-msg {
            color: #ef4444;
            font-size: 13px;
            margin-top: 8px;
            display: none;
        }
        .form-section { display: none; }
        .form-section.active { display: block; }
        .register-link {
            display: none;
            margin-top: 16px;
            text-align: center;
            color: #10a37f;
            font-size: 13px;
            text-decoration: none;
        }
        .register-link:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="logo">
            <div class="logo-icon">M</div>
            <h1>Mini Agent</h1>
        </div>
        
        <div id="loginForm" class="form-section active">
            <div class="form-group">
                <label>用户名</label>
                <input type="text" id="loginUsername" placeholder="请输入用户名"
                       onkeydown="if(event.key==='Enter')doLogin()">
            </div>
            <div class="form-group">
                <label>密码</label>
                <input type="password" id="loginPassword" placeholder="请输入密码"
                       onkeydown="if(event.key==='Enter')doLogin()">
            </div>
            <div class="error-msg" id="loginError"></div>
            <button class="submit-btn" onclick="doLogin()">登录</button>
            <a id="portalRegister" class="register-link" href="#">没有账号？去云端注册</a>
        </div>
    </div>

    <script src="/js/security.js"></script>
    <script>
        // 进入登录页即视为未登录态：清空可能残留的 token
        try { window.MiniAuth.clear(); } catch (_) {}

        // 注册只在云端网页做。地址来自 Electron，不从公开 API 读。
        (async function wireCloudRegister() {
            const api = window.electronAPI;
            const link = document.getElementById('portalRegister');
            if (!api || !api.getPortalUrl || !api.openExternal) {
                return;
            }
            let url = '';
            try {
                url = await api.getPortalUrl();
            } catch (e) {
                return;
            }
            if (!url) {
                return;
            }
            link.style.display = 'block';
            link.onclick = async function (event) {
                event.preventDefault();
                const target = url.replace(/\/+$/, '') + '/login?desktop=1';
                const opened = await api.openExternal(target);
                const errEl = document.getElementById('loginError');
                if (!opened || !opened.ok) {
                    errEl.textContent = '打不开注册页：'
                        + ((opened && opened.error) || '未知原因');
                    errEl.style.display = 'block';
                }
            };
        })();

        async function doLogin() {
            const username = document.getElementById('loginUsername').value.trim();
            const password = document.getElementById('loginPassword').value;
            const errEl = document.getElementById('loginError');
            errEl.style.display = 'none';
            
            if (!username || !password) {
                errEl.textContent = '请输入用户名和密码';
                errEl.style.display = 'block';
                return;
            }
            
            try {
                const resp = await fetch('/api/tokens', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                const data = await resp.json();
                const token = data.data && data.data.token;
                if (data.success && token) {
                    window.MiniAuth.setToken(token);
                    window.location.href = '/';
                } else {
                    errEl.textContent = data.message || '登录失败';
                    errEl.style.display = 'block';
                }
            } catch (e) {
                errEl.textContent = '网络错误';
                errEl.style.display = 'block';
            }
        }
    </script>
</body>
</html>
