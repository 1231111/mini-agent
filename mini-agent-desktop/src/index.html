<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>MiniAgent</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: transparent; color: #d7f6ff;
      font: 14px/1.45 "Segoe UI", sans-serif; overflow: hidden; }
    /* 启动时只留仙鹤。失败才铺一层底，把原因写出来。 */
    #boot { position: relative; height: 100%; background: transparent;
      display: flex; flex-direction: column; align-items: center; justify-content: flex-end; }
    #c { position: absolute; inset: 0; width: 100%; height: 100%; }
    .scan { display: none; }
    #boot { overflow: hidden; isolation: isolate; }
    #c { z-index: 0; }
    .boot-box { position: relative; z-index: 1; }
    .boot-box { display: none; }
    #boot.boot-failed { background: rgba(7, 11, 16, 0.94); justify-content: center; }
    #boot.boot-failed .boot-box { position: relative; z-index: 1; display: flex;
      flex-direction: column; align-items: center; padding: 28px 24px; }
    .boot-name { font-size: 13px; letter-spacing: .28em; color: rgba(180, 245, 255, .92);
      margin-bottom: 10px; }
    /* 「请稍候」是启动中的话术，失败时收掉，避免红字下面还在劝等待。 */
    .boot-done .boot-tip { display: none; }
    .boot-stage { font-size: 13px; color: #9ad7e6; min-height: 1.4em; text-align: center; }
    .boot-elapsed { margin-top: 6px; font-size: 12px; color: #6f93a0;
      font-variant-numeric: tabular-nums; }
    .boot-tip { margin-top: 16px; font-size: 12px; color: #5c7a86;
      max-width: 320px; text-align: center; line-height: 1.65; }
    .bursting .boot-box { opacity: 0; transition: opacity .25s ease; }
  </style>
</head>
<body>
  <!--
    这个页面是壳窗口的首屏（main.js 的 loadFile('src/index.html')），只干两件事：
      1. 显示后端启动进度（订阅主进程推来的 boot-stage 事件）
      2. 启动失败时给出可读诊断
    后端就绪后由主进程 loadURL 把整个窗口切到后端自带的完整界面，
    本页不做任何跳转 —— 两边都跳会打架（那边刚切过去，这边又把简化页盖回来）。

    改这个文件前注意一个陷阱：preload.js 用 contextBridge.exposeInMainWorld 挂了
    `api` / `electronAPI` 两个**不可配置**的全局属性。页面顶层若再声明同名标识符，
    按规范会触发解析期 SyntaxError —— 整段脚本一行都不执行，界面永远停在启动页，
    连超时都不会报。所以本页所有脚本都包在 IIFE 里，让标识符退到函数作用域。

    历史：这里曾有过一套"壳内自带一份简化聊天页"的实现（AGENTS 列表 / #login 卡片 /
    #app 双栏 / send() / waitReady()）。窗口改成直接承载后端 UI 之后那套已不在产品
    路径上，2026-10-09 整段删除，只留启动画面。
  -->
  <div id="boot">
    <canvas id="c"></canvas>
    <div class="boot-box">
      <div class="boot-name">MINIAGENT</div>
      <div class="boot-stage" id="bootStage" role="status" aria-live="polite">正在启动本地服务</div>
      <div class="boot-elapsed" id="bootElapsed">已用 0 秒</div>
      <div class="boot-tip">首次启动需要加载本地模型，会比之后再启动慢一些。请稍候，不要重复双击图标。</div>
    </div>
  </div>
  <script src="vendor/three.min.js"></script>
  <script src="crane-scene.js"></script>
  <script>
  /* 看门狗。只做一件事：绝不让界面无声地停在启动页。
     为什么必须有它：这类"脚本压根没跑起来"的故障是解析期失败，一行都不执行，
     既不 resolve 也不 reject，界面连「本机服务没起来」都等不到 ——
     文件头那段注释里记的 SyntaxError 陷阱正是这种故障的来源。
     它单独占一个 <script> 并包在 IIFE 里：不与将来新增的脚本共用作用域，
     自己也不会往全局挂任何标识符。 */
  (function () {
    var bootEl = document.getElementById('boot');
    var stageEl = document.getElementById('bootStage');
    var elapsedEl = document.getElementById('bootElapsed');

    function boot() { return bootEl; }
    function reveal() {
      if (window.electronAPI && window.electronAPI.bootReveal) {
        window.electronAPI.bootReveal();
      }
    }
    function fail(msg) {
      var el = boot();
      if (el) el.classList.add('boot-failed');
      reveal();
      if (!el || document.getElementById('bootWatch')) return;
      var d = document.createElement('div');
      d.id = 'bootWatch';
      d.style.cssText = 'position:relative;z-index:2;margin:0 24px 28px;color:#f87171;' +
                        'font-size:12px;line-height:1.6;white-space:pre-wrap;max-width:520px;text-align:left';
      d.textContent = msg;
      el.appendChild(d);
      el.style.flexDirection = 'column';
    }

    /* 本地秒表。
       为什么不只显示主进程推来的 elapsedMs：它一秒才推一次，而且本地渲染
       和它不同步，数字会跳；更要紧的是它万一没推成功，秒数就彻底停住 ——
       那正是这里最想避免的"看起来卡死"。所以本地自己走一份，收到主进程的
       值就当校准。 */
    var started = Date.now();
    function paint(ms) {
      if (elapsedEl) {
        elapsedEl.textContent = '已用 ' + Math.max(0, Math.round(ms / 1000)) + ' 秒';
      }
    }
    paint(0);
    var tick = setInterval(function () { paint(Date.now() - started); }, 1000);

    // 主进程推来的阶段是权威的：只有它知道后端是真在起、还是已经失败了。
    var gotStage = false;
    var bursting = false;
    if (window.electronAPI && window.electronAPI.onBootStage) {
      window.electronAPI.onBootStage(function (s) {
        if (!s) return;
        gotStage = true;
        if (s.message && stageEl) stageEl.textContent = s.message;
        if (typeof s.elapsedMs === 'number') paint(s.elapsedMs);
        if (s.stage === 'failed') {
          if (bootEl) {
            bootEl.classList.add('boot-done');
            bootEl.classList.add('boot-failed');
          }
          reveal();
          clearInterval(tick);
        }
        if (s.stage === 'ready' && !bursting) {
          bursting = true;
          if (bootEl) bootEl.classList.add('bursting');
          var scene = window.craneScene;
          var finish = function () {
            if (window.electronAPI && window.electronAPI.bootBurstDone) {
              window.electronAPI.bootBurstDone();
            }
          };
          if (scene && scene.burst) {
            scene.burst().then(finish);
          } else {
            finish();
          }
        }
      });
    }

    if (window.electronAPI && window.electronAPI.onBackendError) {
      window.electronAPI.onBackendError(function (p) {
        clearInterval(tick);
        fail('本机服务启动失败：' + ((p && p.message) || '未知原因') +
             (p && p.logPath ? '\n\n日志：' + p.logPath : ''));
      });
    }

    window.addEventListener('error', function (e) {
      fail('页面脚本出错：' + (e.message || (e.error && e.error.message) || String(e.type)) +
           (e.filename ? '\n位置：' + e.filename + ':' + e.lineno : ''));
    });
    window.addEventListener('unhandledrejection', function (e) {
      fail('页面未处理的 Promise 拒绝：' + ((e.reason && e.reason.message) || String(e.reason)));
    });

    /* 兜底。主进程正常时一秒内就会推第一次阶段；一直没推说明这条桥断了
       （preload 没加载、或事件名对不上），页面会无声地停在启动画面上。
       阈值取得比主进程自己的启动超时（120 秒）短，是为了更早把问题暴露出来。 */
    setTimeout(function () {
      if (!gotStage) {
        fail('没有收到启动进度（30 秒）。按 F12 打开开发者工具看 Console，' +
             '或查看数据目录下 logs/renderer.log。');
      }
    }, 30000);
  })();
  </script>
</body>
</html>
