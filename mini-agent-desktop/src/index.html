<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>MiniAgent</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden;
      background: #0b1020; color: #eef2ff; font: 14px/1.45 "Segoe UI", sans-serif; }
    #boot { position: relative; isolation: isolate; display: grid; place-items: center;
      width: 100%; height: 100%; overflow: hidden;
      background: radial-gradient(ellipse at 50% 37%, rgba(79, 105, 214, .2), transparent 42%),
        radial-gradient(ellipse at 50% 110%, rgba(43, 65, 133, .18), transparent 50%), #0b1020; }
    #boot::before { content: ""; position: absolute; inset: 0; z-index: 0; opacity: .22;
      background-image: linear-gradient(rgba(164, 180, 255, .045) 1px, transparent 1px),
        linear-gradient(90deg, rgba(164, 180, 255, .045) 1px, transparent 1px);
      background-size: 36px 36px; mask-image: linear-gradient(to bottom, transparent, #000 30%, #000 82%, transparent); }
    .boot-box { position: relative; z-index: 1; width: 100%; height: 100%; padding: 30px 34px 24px; display: flex;
      flex-direction: column; align-items: center; justify-content: center; text-align: center; }
    .boot-mark { position: relative; display: grid; place-items: center; width: 92px; height: 92px;
      margin-bottom: 22px; border-radius: 28px; background: rgba(255,255,255,.055);
      box-shadow: 0 16px 55px rgba(44, 74, 180, .2), inset 0 1px 0 rgba(255,255,255,.08); }
    .boot-mark::before { content: ""; position: absolute; inset: -9px; border-radius: 34px;
      border: 1px solid rgba(140, 162, 255, .18); animation: mark-pulse 2.8s ease-in-out infinite; }
    .boot-mark img { width: 76px; height: 76px; border-radius: 19px; animation: mark-float 3.4s ease-in-out infinite; }
    .boot-name { font-size: 19px; line-height: 1.2; letter-spacing: .16em; font-weight: 650; }
    .boot-subtitle { margin-top: 8px; color: #8994b8; font-size: 12px; letter-spacing: .04em; }
    .boot-progress { width: 250px; height: 3px; margin-top: 28px; overflow: hidden;
      border-radius: 99px; background: rgba(151, 166, 218, .14); }
    .boot-progress span { display: block; width: 34%; height: 100%; border-radius: inherit;
      background: linear-gradient(90deg, #727ff1, #72d4ff); box-shadow: 0 0 14px rgba(113, 164, 255, .65);
      animation: progress-run 1.6s ease-in-out infinite; }
    .boot-stage { min-height: 1.5em; margin-top: 16px; color: #c4cbea; font-size: 13px; }
    .boot-elapsed { margin-top: 5px; color: #7480a5; font-size: 11px; font-variant-numeric: tabular-nums; }
    .boot-tip { position: absolute; bottom: 21px; max-width: 360px; color: #677394;
      font-size: 11px; line-height: 1.5; }
    #boot.boot-failed { background: radial-gradient(ellipse at 50% 25%, rgba(120, 44, 63, .23), transparent 52%), #0b1020; }
    #boot.boot-failed .boot-box { justify-content: center; }
    #boot.boot-failed .boot-mark, .boot-done .boot-tip { display: none; }
    #boot.boot-failed .boot-name { margin-bottom: 18px; }
    #boot.boot-failed .boot-stage { color: #ff9eaa; }
    #boot.boot-failed .boot-progress { display: none; }
    #boot.boot-ready .boot-box { opacity: 0; transform: translateY(-8px) scale(.97);
      transition: opacity .32s ease, transform .32s ease; }
    #boot.boot-ready .boot-progress span { width: 100%; animation: none; transition: width .2s ease; }
    @keyframes mark-pulse { 0%,100% { transform: scale(.98); opacity: .45; } 50% { transform: scale(1.04); opacity: .9; } }
    @keyframes mark-float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-3px); } }
    @keyframes progress-run { 0% { transform: translateX(-120%); } 100% { transform: translateX(390%); } }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; }
    }
  </style>
</head>
<body>
  <!--
    这个页面是壳窗口的首屏（main.js 的 loadFile('src/index.html')），只干两件事：
      1. 显示后端启动进度（订阅主进程推来的 boot-stage 事件）
      2. 启动失败时给出可读诊断
    后端就绪后由主进程 loadURL 把整个窗口切到后端自带的完整界面，
    本页不做任何跳转 —— 两边都跳会打架（那边刚切过去，这边又把简化页盖回来）。

    改这个文件前注意一个陷阱：preload.js 用 contextBridge.exposeInMainWorld 挂了
    `api` / `electronAPI` 两个**不可配置**的全局属性。页面顶层若再声明同名标识符，
    按规范会触发解析期 SyntaxError —— 整段脚本一行都不执行，界面永远停在启动页，
    连超时都不会报。所以本页所有脚本都包在 IIFE 里，让标识符退到函数作用域。

    历史：这里曾有过一套"壳内自带一份简化聊天页"的实现（AGENTS 列表 / #login 卡片 /
    #app 双栏 / send() / waitReady()）。窗口改成直接承载后端 UI 之后那套已不在产品
    路径上，2026-10-09 整段删除，只留启动画面。
  -->
  <div id="boot">
    <div class="boot-box">
      <div class="boot-mark"><img src="../assets/icon.svg" alt="MiniAgent AI"></div>
      <div class="boot-name">MINIAGENT</div>
      <div class="boot-subtitle">你的本地智能工作台</div>
      <div class="boot-progress" aria-hidden="true"><span></span></div>
      <div class="boot-stage" id="bootStage" role="status" aria-live="polite">正在启动本地服务</div>
      <div class="boot-elapsed" id="bootElapsed">已用 0 秒</div>
      <div class="boot-tip">首次启动需要加载本地模型，会比之后再启动慢一些。请稍候，不要重复双击图标。</div>
    </div>
  </div>
  <script>
  /* 看门狗。只做一件事：绝不让界面无声地停在启动页。
     为什么必须有它：这类"脚本压根没跑起来"的故障是解析期失败，一行都不执行，
     既不 resolve 也不 reject，界面连「本机服务没起来」都等不到 ——
     文件头那段注释里记的 SyntaxError 陷阱正是这种故障的来源。
     它单独占一个 <script> 并包在 IIFE 里：不与将来新增的脚本共用作用域，
     自己也不会往全局挂任何标识符。 */
  (function () {
    var bootEl = document.getElementById('boot');
    var stageEl = document.getElementById('bootStage');
    var elapsedEl = document.getElementById('bootElapsed');

    function boot() { return bootEl; }
    function reveal() {
      if (window.electronAPI && window.electronAPI.bootReveal) {
        window.electronAPI.bootReveal();
      }
    }
    function fail(msg) {
      var el = boot();
      if (el) el.classList.add('boot-failed');
      reveal();
      if (!el || document.getElementById('bootWatch')) return;
      var d = document.createElement('div');
      d.id = 'bootWatch';
      d.style.cssText = 'position:relative;z-index:2;margin:0 24px 28px;color:#f87171;' +
                        'font-size:12px;line-height:1.6;white-space:pre-wrap;max-width:520px;text-align:left';
      d.textContent = msg;
      el.appendChild(d);
      el.style.flexDirection = 'column';
    }

    /* 本地秒表。
       为什么不只显示主进程推来的 elapsedMs：它一秒才推一次，而且本地渲染
       和它不同步，数字会跳；更要紧的是它万一没推成功，秒数就彻底停住 ——
       那正是这里最想避免的"看起来卡死"。所以本地自己走一份，收到主进程的
       值就当校准。 */
    var started = Date.now();
    function paint(ms) {
      if (elapsedEl) {
        elapsedEl.textContent = '已用 ' + Math.max(0, Math.round(ms / 1000)) + ' 秒';
      }
    }
    paint(0);
    var tick = setInterval(function () { paint(Date.now() - started); }, 1000);

    // 主进程推来的阶段是权威的：只有它知道后端是真在起、还是已经失败了。
    var gotStage = false;
    var finishingAnimation = false;
    if (window.electronAPI && window.electronAPI.onBootStage) {
      window.electronAPI.onBootStage(function (s) {
        if (!s) return;
        gotStage = true;
        if (s.message && stageEl) stageEl.textContent = s.message;
        if (typeof s.elapsedMs === 'number') paint(s.elapsedMs);
        if (s.stage === 'failed') {
          if (bootEl) {
            bootEl.classList.add('boot-done');
            bootEl.classList.add('boot-failed');
          }
          reveal();
          clearInterval(tick);
        }
        if (s.stage === 'ready' && !finishingAnimation) {
          finishingAnimation = true;
          var finish = function () {
            if (window.electronAPI && window.electronAPI.bootAnimationDone) {
              window.electronAPI.bootAnimationDone();
            }
          };
          if (bootEl) bootEl.classList.add('boot-ready');
          setTimeout(finish, 360);
        }
      });
    }

    if (window.electronAPI && window.electronAPI.onBackendError) {
      window.electronAPI.onBackendError(function (p) {
        clearInterval(tick);
        fail('本机服务启动失败：' + ((p && p.message) || '未知原因') +
             (p && p.logPath ? '\n\n日志：' + p.logPath : ''));
      });
    }

    window.addEventListener('error', function (e) {
      fail('页面脚本出错：' + (e.message || (e.error && e.error.message) || String(e.type)) +
           (e.filename ? '\n位置：' + e.filename + ':' + e.lineno : ''));
    });
    window.addEventListener('unhandledrejection', function (e) {
      fail('页面未处理的 Promise 拒绝：' + ((e.reason && e.reason.message) || String(e.reason)));
    });

    /* 兜底。主进程正常时一秒内就会推第一次阶段；一直没推说明这条桥断了
       （preload 没加载、或事件名对不上），页面会无声地停在启动画面上。
       阈值取得比主进程自己的启动超时（120 秒）短，是为了更早把问题暴露出来。 */
    setTimeout(function () {
      if (!gotStage) {
        fail('没有收到启动进度（30 秒）。按 F12 打开开发者工具看 Console，' +
             '或查看数据目录下 logs/renderer.log。');
      }
    }, 30000);
  })();
  </script>
</body>
</html>
