<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MiniAgent</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      background: #1a1a2e;
      color: #eee;
      overflow: hidden;
    }

    /* 加载状态 */
    .loading-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      background: #1a1a2e;
    }

    .loading-spinner {
      width: 60px;
      height: 60px;
      border: 4px solid #333;
      border-top-color: #667eea;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    .loading-text {
      margin-top: 24px;
      color: #ccc;
      font-size: 18px;
    }

    .loading-status {
      margin-top: 12px;
      color: #667eea;
      font-size: 14px;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* 错误状态 */
    .error-container {
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      background: #1a1a2e;
      padding: 40px;
    }

    .error-icon {
      font-size: 64px;
      margin-bottom: 24px;
    }

    .error-title {
      font-size: 24px;
      color: #ff5f57;
      margin-bottom: 16px;
    }

    .error-message {
      color: #aaa;
      text-align: center;
      max-width: 500px;
      line-height: 1.8;
      font-size: 14px;
    }

    .error-detail {
      margin-top: 20px;
      padding: 16px;
      background: #16213e;
      border-radius: 8px;
      max-width: 500px;
      width: 100%;
    }

    .error-detail pre {
      color: #888;
      font-size: 12px;
      white-space: pre-wrap;
      word-break: break-all;
    }

    .retry-btn {
      margin-top: 30px;
      padding: 14px 36px;
      background: #667eea;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
      transition: background 0.2s;
    }

    .retry-btn:hover {
      background: #5a6fd6;
    }

    /* iframe 容器 */
    #app-frame {
      width: 100%;
      height: 100vh;
      border: none;
      display: none;
    }
  </style>
</head>
<body>
  <!-- 加载状态 -->
  <div class="loading-container" id="loading">
    <div class="loading-spinner"></div>
    <div class="loading-text">MiniAgent</div>
    <div class="loading-status" id="loading-status">正在检测后端服务...</div>
  </div>

  <!-- 错误状态 -->
  <div class="error-container" id="error">
    <div class="error-icon">⚠️</div>
    <div class="error-title">无法连接后端服务</div>
    <div class="error-message" id="error-message">
      请确保 Java 后端已启动。<br>
      启动命令：<code>mvn spring-boot:run -pl mini-agent-app</code>
    </div>
    <div class="error-detail" id="error-detail" style="display:none;">
      <pre id="error-stack"></pre>
    </div>
    <button class="retry-btn" id="retry-btn">重新连接</button>
  </div>

  <!-- 应用内容 -->
  <iframe id="app-frame" allow="microphone"></iframe>

  <script>
    console.log('[MiniAgent] Script loaded');

    const loading = document.getElementById('loading');
    const loadingStatus = document.getElementById('loading-status');
    const error = document.getElementById('error');
    const errorMessage = document.getElementById('error-message');
    const errorDetail = document.getElementById('error-detail');
    const errorStack = document.getElementById('error-stack');
    const appFrame = document.getElementById('app-frame');
    const retryBtn = document.getElementById('retry-btn');

    // 获取后端地址并加载应用
    async function initApp() {
      try {
        console.log('[MiniAgent] initApp start');

        // 重置状态
        loading.style.display = 'flex';
        error.style.display = 'none';
        appFrame.style.display = 'none';

        loadingStatus.textContent = '正在检测后端服务...';

        let apiBase = 'http://localhost:8080';
        if (window.electronAPI) {
          try {
            apiBase = await window.electronAPI.getApiBase();
            console.log('[MiniAgent] API base:', apiBase);
          } catch (e) {
            console.log('[MiniAgent] Failed to get API base, using default');
          }
        }

        // 等待后端启动
        let retries = 0;
        const maxRetries = 30;
        let lastError = '';

        while (retries < maxRetries) {
          try {
            loadingStatus.textContent = `正在连接后端服务... (${retries + 1}/${maxRetries})`;
            const response = await fetch(apiBase + '/', {
              method: 'GET',
              signal: AbortSignal.timeout(3000)
            });
            console.log('[MiniAgent] Response status:', response.status);

            // 只要服务有响应就认为成功
            loadingStatus.textContent = '后端服务已就绪，正在加载...';
            break;
          } catch (e) {
            lastError = e.message || e.toString();
            console.log('[MiniAgent] Connection attempt failed:', lastError);
          }

          retries++;
          await new Promise(r => setTimeout(r, 1000));
        }

        if (retries >= maxRetries) {
          throw new Error('无法连接到后端服务 (http://localhost:8080)\n\n请确认：\n1. Java 后端已启动\n2. 端口 8080 未被占用\n3. 防火墙未阻止连接');
        }

        // 加载应用
        loadingStatus.textContent = '正在加载应用...';
        loading.style.display = 'none';
        appFrame.src = apiBase + '/';
        appFrame.style.display = 'block';
        console.log('[MiniAgent] App loaded');

      } catch (e) {
        console.error('[MiniAgent] Error:', e);
        loading.style.display = 'none';
        error.style.display = 'flex';
        errorMessage.innerHTML = (e.message || '无法连接到后端服务').replace(/\n/g, '<br>');
        if (e.stack) {
          errorDetail.style.display = 'block';
          errorStack.textContent = e.stack;
        }
      }
    }

    // 重试按钮
    retryBtn.addEventListener('click', () => {
      initApp();
    });

    // 启动应用
    console.log('[MiniAgent] Starting app...');
    initApp();
  </script>
</body>
</html>
