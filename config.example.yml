# ============================================================
# MiniAgent 外部配置模板
# ============================================================
# 用法：
#   复制本文件到 ${MINI_AGENT_HOME:-${user.home}/.miniagent}/config.yml
#   （Windows 默认 %USERPROFILE%\.miniagent\config.yml
#     Linux/macOS 默认 ~/.miniagent/config.yml）
#   然后把下面各键填上自己的值。
#
# 这个文件刻意放在版本库里，config.yml 本身不进版本库。
#
# 加载方式：application.yml 顶部
#   spring.config.import:
#     - optional:file:${MINI_AGENT_HOME:${user.home}/.miniagent}/config.yml
# optional: 前缀表示文件不存在时静默跳过，应用仍能启动 ——
# 但依赖这些密钥的功能（联网搜索、生图等）会因缺少凭证而失败。
#
# 排查是否加载成功：启动日志中搜索 "config.yml"，
# 或访问 /actuator/env 查看 CHATANYWHERE_API_KEY 等键的来源。
# ============================================================

# 本地 MySQL 密码（application.yml: spring.datasource.password）
MYSQL_PASSWORD: ''

# 对话模型预设：agent.models.presets 中 chatanywhere 那一项用的 key
CHATANYWHERE_API_KEY: ''

# 联网搜索（application.yml: web.search.backend 选择用哪个）
TAVILY_API_KEY: ''
BING_API_KEY: ''
GOOGLE_API_KEY: ''
GOOGLE_CSE_ID: ''
# 可选：现有搜索/抓取提供方失败或无有效结果时，才使用 DeepSeek Search/Fetch 付费降级
DEEPSEEK_API_KEY: ''
DEEPSEEK_API_BASE_URL: 'https://api.deepseek.com'

# 图像生成 / 对话模型共用的 MiMo key。
# application.yml 的 langchain4j.open-ai.chat-model.api-key 写法是
# ${LLM_API_KEY:${MIMO_API_KEY:}} —— LLM_API_KEY 优先级更高，
# 只想让对话走另一个 key 时才需要单独填 LLM_API_KEY。
MIMO_API_KEY: ''
LLM_API_KEY: ''
CHATANYWHERE_IMAGE_KEY: ''
SILICONFLOW_API_KEY: ''
FAL_KEY: ''
ZHIPU_API_KEY: ''

# 生歌（也可用环境变量 SENSEAUDIO_API_KEY）
SENSEAUDIO_API_KEY: ''

# MiniMax 音乐（开放平台接口密钥，不是 MIMO_API_KEY）
# https://platform.minimaxi.com/user-center/basic-information/interface-key
MINIMAX_API_KEY: ''

# Google Lyria（AI Studio 的 Gemini key，不是上面的 GOOGLE_API_KEY）
# https://aistudio.google.com/apikey
GEMINI_API_KEY: ''

# MCP 外部服务示例（在 application.yml 的 agent.mcp.servers 配置）。
# MCP 默认关闭；每台服务器必须设置非空 allowed-tools 精确列出需要开放的远端工具，
# 且必须与服务 tools/list 完全一致。缺失白名单时不会启动子进程。
# server 的凭据请放在该项自己的 env 映射里，工具权限仍由会话审批策略控制。

# JWT 签名密钥：HS256 要求 >= 32 字节。生成：
#   python -c "import secrets,base64;print(base64.b64encode(secrets.token_bytes(48)).decode())"
#
# 这一行故意保持注释状态。prod profile 要求显式提供强密钥；开发默认值只在 dev profile 使用。
# 不要留成 JWT_SECRET: ''，空值会覆盖配置并导致启动失败。
# 要用就取消注释并填入随机值；生成方式见上方命令。
# JWT_SECRET: ''
