# MiniAgent 中间件编排：只起 mysql + redis，应用 jar 在宿主机单独启动。
#
#   docker compose -f docker-compose.middleware.yml up -d
#   ./scripts/run-app.sh          # Linux / macOS
#   powershell scripts\run-app.ps1  # Windows
#
# 与 docker-compose.yml 的关系：
#   那份编排的是「账号服务 + 记忆服务」两个独立进程，用的是同一个 3306 端口和同一个
#   container_name，**不能与本文件同时启动**。两边同时 up 的报错是
#   "Bind for 127.0.0.1:3306 failed: port is already allocated"。
#   要切过去先 `docker compose -f docker-compose.middleware.yml down`。
#
# 为什么中间件与应用分开：
#   应用容器化后，改一行配置就要重建镜像（mvn 打包 + 镜像层），而镜像里
#   还有 534MB 的 fat jar；调试期这个循环是分钟级的。jar 放宿主机、中间件放容器，
#   改配置只需重启 java 进程（秒级），日志也直接落在宿主机的 ~/.miniagent/logs。
#
# 这两个容器都是必需的，不是"看情况"：
#   mysql —— 业务真相源，prod 档 ddl-auto=validate，表由 Flyway 建。
#   redis —— prod 档的 ProductionReadinessValidator 硬断言
#            agent.replica.mode 必须是 redis（见该文件第 77 行），
#            而 redis 模式下有 8 个 bean 依赖它（RedisSessionStore / RedisRateLimiter /
#            RedisTaskConcurrency 等）。少一个容器，应用直接拒绝启动。

services:
  mysql:
    image: mysql:8.0
    container_name: miniagent-mysql
    environment:
      # 不给默认值：仓库里能查到的口令等于没有口令。
      # ${VAR:?} 让未设置时 compose 直接报错退出，而不是静默用弱口令起来。
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD 必须显式设置（不要使用仓库示例值）}
      MYSQL_DATABASE: mini_agent
      MYSQL_CHARACTER_SET_SERVER: utf8mb4
      MYSQL_COLLATION_SERVER: utf8mb4_unicode_ci
    ports:
      # 只绑回环。应用在同一台机器上跑，走 127.0.0.1 即可，不需要对公网发布。
      - "127.0.0.1:3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      # 建 mini_agent_memory 库，给独立的记忆服务用；app 单体不需要它，留着无害。
      - ./docker/mysql-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # 密码必须与上面 MYSQL_ROOT_PASSWORD 同源。写死密码的话，一旦有人覆盖了
      # root 口令，健康检查就永远失败，而日志里只看到 mysql 反复 unhealthy。
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$${MYSQL_ROOT_PASSWORD}\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  redis:
    image: redis:7-alpine
    container_name: miniagent-redis
    ports:
      - "127.0.0.1:6379:6379"
    # 必须带 --requirepass：prod 断言要求 REDIS_PASSWORD 非空，而 Redis 自己不校验
    # 的话，那个变量就只是一行摆设 —— 应用以为连的是带认证的 Redis，实际是裸的。
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?REDIS_PASSWORD 必须显式设置}"]
    volumes:
      - redis-data:/data
    healthcheck:
      # 带密码后 ping 必须认证，否则容器永远不 healthy，应用卡在启动阶段。
      # --no-auth-warning 只是为了不让 "Using a password with -a" 刷满日志。
      test: ["CMD", "redis-cli", "--no-auth-warning", "-a", "${REDIS_PASSWORD:?}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  mysql-data:
  redis-data:
