# Production profile for the standalone Account JAR.
server:
  address: ${ACCOUNT_SERVER_ADDRESS:0.0.0.0}
  port: ${ACCOUNT_SERVER_PORT:8081}

spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    baseline-on-migrate: true
    table: flyway_schema_history_account

logging:
  level:
    com.miniagent: INFO
    root: WARN

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

agent:
  account:
    registration-enabled: true
    password-min-length: 12
    bcrypt-strength: 12
    internal-key: ${ACCOUNT_INTERNAL_KEY:}
    memory-token-key: ${ACCOUNT_MEMORY_TOKEN_KEY:}
