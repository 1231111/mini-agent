# 账号服务默认档（本地开发/联调）。
#
# 与云端 agent 的关键差异只有一条：这里 registration-enabled 默认就是 true。
# 云端 agent 的 prod 档被 ProductionReadinessValidator 硬断言必须关掉公开注册，
# 而"注册在 web 端"需要一个能开注册的地方 —— 那个地方就是这个服务。
# 拆分的收益正是这条：agent 侧那条安全断言一行都不用动。

server:
  port: ${ACCOUNT_SERVER_PORT:8081}

spring:
  profiles:
    # Never silently fall back to a development account service. Use
    # `--spring.profiles.active=dev` only for local development.
    default: prod
  application:
    name: mini-agent-account

  datasource:
    # 默认连本机 127.0.0.1:3306。
    # 与云端 agent 指向同一个库 —— 见 db/migration/V1 的说明。
    #
    # 密码从环境变量注入。固定的本地开发值只在 application-dev.yml；prod profile 会
    # 校验解析后的口令，拒绝缺失、短值和曾提交的开发口令。
    # Secure by default. The dev profile explicitly opts into a local
    # non-TLS database; prod requires VERIFY_IDENTITY through its validator.
    url: ${DB_URL:jdbc:mysql://127.0.0.1:3306/mini_agent?sslMode=VERIFY_IDENTITY&serverTimezone=Asia/Shanghai&characterEncoding=UTF-8}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}

  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      connect-timeout: 1s
      timeout: 1s

  jpa:
    hibernate:
      # validate 而不是 none：共享库场景下，本服务对 users/tenants 的理解
      # 一旦与云端 agent 的建表结果不一致，应该在这里就炸，而不是等到写数据时才出问题。
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true
    baseline-on-migrate: true
    clean-disabled: true
    out-of-order: false
    # 与云端 agent 共用同一个库，但各管各的表，所以必须用各自的历史表。
    # 共用一张 flyway_schema_history 的后果：两个应用会互相把对方的迁移记录
    # 当成"缺失"或"漂移"，启动时直接报校验失败。
    table: flyway_schema_history_account

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
  info:
    # 暴露 build-info 插件写入的 META-INF/build-info.properties。
    # 线上排查"部署到底生效没"时，GET /actuator/info 直接给出本次构建的时间与版本。
    build:
      enabled: true

agent:
  account:
    registration-enabled: true
    password-min-length: 12
    bcrypt-strength: 12
    login-rate-limit:
      attempts-per-minute: ${ACCOUNT_LOGIN_ATTEMPTS_PER_MINUTE:10}
      attempts-per-ip-per-minute: ${ACCOUNT_LOGIN_ATTEMPTS_PER_IP_PER_MINUTE:30}
      window-seconds: ${ACCOUNT_LOGIN_RATE_WINDOW_SECONDS:60}
      # Forwarded addresses are ignored until the immediate proxy CIDRs are explicitly trusted.
      trusted-proxies: ${ACCOUNT_TRUSTED_PROXY_CIDRS:}

    # 支付渠道尚未接入。/api/membership/pay-callback 当前始终返回 503，
    # 只有加入真实渠道适配器并校验签名、订单、金额和币种后才能开放。

    # 服务间调用的共享密钥。会员接口只接受带 X-Account-Internal-Key 的请求。
    #
    # 为什么是"服务间密钥"而不是用户会话：本服务不签 token（见 AccountApplication 说明），
    # 所以它没有"用户会话"这个概念。会员查询的鉴权由调用方完成 ——
    # 云端 agent 或客户机本地后端先验掉用户的 token，再带这个密钥转发过来。
    # 留空则不启用会员接口（返回 503 并在启动时 WARN），不会静默地变成无鉴权。
    internal-key: ${ACCOUNT_INTERNAL_KEY:}

    # 记忆访问令牌的 AES-256 密钥：本服务用它加密 ma1. 令牌，memory-service 用它解密校验。
    # 两边必须完全一致（见 mini-agent-memory-service 的同名配置项）。
    #
    # 通过 ACCOUNT_MEMORY_TOKEN_KEY 注入；prod profile 要求解码后正好 32 字节，
    # 并拒绝曾提交的开发密钥。Account 与 memory-service 必须同时配置同一把密钥。
    memory-token-key: ${ACCOUNT_MEMORY_TOKEN_KEY:}

logging:
  level:
    com.miniagent: INFO
    root: WARN
