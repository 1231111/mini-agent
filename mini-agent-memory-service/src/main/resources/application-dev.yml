# Local development values are read from the gitignored .env file or IDE environment.
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: ${DB_URL:jdbc:mysql://127.0.0.1:3306/mini_agent_memory?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai&characterEncoding=UTF-8}
    password: ${DB_PASSWORD:}

memory:
  service:
    account-internal-key: ${ACCOUNT_INTERNAL_KEY:}
    memory-token-key: ${ACCOUNT_MEMORY_TOKEN_KEY:}
