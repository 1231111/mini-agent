server:
  address: ${MEMORY_SERVICE_ADDRESS:127.0.0.1}
  port: ${MEMORY_SERVICE_PORT:8091}

spring:
  application:
    name: mini-agent-memory-service
  datasource:
    # 默认连本机 MySQL 的 mini_agent_memory 库（由 Flyway 建表）。
    # 早先默认是 H2 文件库，那是"本机单跑"的形态；改为 MySQL 后与 account 用同一套
    # 口令和地址，部署时不再需要额外注入 DB_*。
    url: ${DB_URL:jdbc:mysql://127.0.0.1:3306/mini_agent_memory?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai&characterEncoding=UTF-8}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:KGEnrzNNVB4bwaJPC7x6LcoZ8NbZ}
  flyway:
    enabled: true
    # 与 App 的 db/migration 路径隔离：两条链各自从 V1 编号，指向两个库（见 db/migration-memory/README.md）
    locations: classpath:db/migration-memory
  jackson:
    serialization:
      write-dates-as-timestamps: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true

memory:
  service:
    # api：只提供 HTTP（测试默认，避免抢评估作业）。worker / all：升级并进程内回放。compose 设 all。
    role: ${MEMORY_SERVICE_ROLE:api}
    account-base-url: ${ACCOUNT_BASE_URL:}
    account-internal-key: ${ACCOUNT_INTERNAL_KEY:gMPzIKw7wTtIZOhGibpoAGkdzzXYbsEEfhUVDg0Tb1w=}
    # 必须与 mini-agent-account 的 agent.account.memory-token-key 完全一致：
    # Account 用它加密 ma1. 令牌，这里用它解密（Account 不可达时的离线校验路径）。
    memory-token-key: ${ACCOUNT_MEMORY_TOKEN_KEY:mMdxSRXpWYc8ApX3ejLKFsxzUN0ZBMW5GkE7Rjv5QmI=}
    account-connect-timeout-ms: ${ACCOUNT_CONNECT_TIMEOUT_MS:1500}
    account-read-timeout-ms: ${ACCOUNT_READ_TIMEOUT_MS:2500}
    issuers:
      eval-worker:
        public-keys: ${MEMORY_SERVICE_EVAL_PUBLIC_KEYS:}
        roles: eval
  evolution:
    policy:
      default-mode: ${MEMORY_EVOLUTION_DEFAULT_MODE:AUTO}
    experiment:
      # 客户端只使用本库当前修订，不跑对照臂。离线通过后直接升级，再同步回客户端。
      require-live-arms: ${MEMORY_EVOLUTION_REQUIRE_LIVE_ARMS:false}
    llm:
      base-url: ${MEMORY_EVOLUTION_LLM_BASE_URL:${LLM_BASE_URL:https://token-plan-cn.xiaomimimo.com/v1}}
      api-key: ${MEMORY_EVOLUTION_LLM_API_KEY:${LLM_API_KEY:}}
      model: ${MEMORY_EVOLUTION_LLM_MODEL:${LLM_MODEL:mimo-v2.6-pro}}
    budget:
      daily-tokens-per-tenant: ${MEMORY_EVOLUTION_DAILY_TOKENS:2000000}

# 进程内离线回放。未配置规划或裁判地址时不领取评估作业。
eval-worker:
  planner:
    base-url: ${EVAL_PLANNER_BASE_URL:${LLM_BASE_URL:}}
    api-key: ${EVAL_PLANNER_API_KEY:${LLM_API_KEY:}}
    model: ${EVAL_PLANNER_MODEL:${LLM_MODEL:}}
    timeout-seconds: ${EVAL_PLANNER_TIMEOUT_SECONDS:120}
  judge:
    base-url: ${EVAL_JUDGE_BASE_URL:${LLM_BASE_URL:}}
    api-key: ${EVAL_JUDGE_API_KEY:${LLM_API_KEY:}}
    model: ${EVAL_JUDGE_MODEL:${LLM_MODEL:}}
    timeout-seconds: ${EVAL_JUDGE_TIMEOUT_SECONDS:120}
  judge-version: ${EVAL_JUDGE_VERSION:pairwise-swap-v1}
