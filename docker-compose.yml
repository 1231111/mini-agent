services:
  mysql:
    image: mysql:8.0
    container_name: miniagent-mysql
    environment:
      MYSQL_ROOT_PASSWORD: mysql_root_pass
      MYSQL_DATABASE: mini_agent
      MYSQL_CHARACTER_SET_SERVER: utf8mb4
      MYSQL_COLLATION_SERVER: utf8mb4_unicode_ci
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-pmysql_root_pass"]
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    build: .
    container_name: miniagent-app
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: prod
    volumes:
      - app-workspace:/app/workspace
      - app-images:/app/generated-images
      - app-uploads:/app/user-uploads
      - app-memory:/app/memory
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8080/actuator/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s

volumes:
  mysql-data:
  app-workspace:
  app-images:
  app-uploads:
  app-memory:
