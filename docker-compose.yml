services:
  mysql:
    image: mysql:8.0
    container_name: miniagent-mysql
    environment:
      # 不给默认值：仓库里能查到的口令等于没有口令。
      # 旧写法 ${MYSQL_ROOT_PASSWORD:-mysql_root_pass} 让"照抄模板直接 up"变成
      # 用已知口令把 root 版 MySQL 发布到公网（且启动自检只拒绝 changeme/replace-，会放过它）。
      # ${VAR:?} 让未设置时 compose 直接报错退出，而不是静默用弱口令起来。
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD 必须显式设置（不要使用仓库示例值）}
      MYSQL_DATABASE: mini_agent
      MYSQL_CHARACTER_SET_SERVER: utf8mb4
      MYSQL_COLLATION_SERVER: utf8mb4_unicode_ci
    ports:
      # 只绑回环：数据库不该对公网发布。需要远程访问请走 SSH 隧道或内网地址。
      - "127.0.0.1:3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./docker/mysql-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # 密码必须与上面 MYSQL_ROOT_PASSWORD 同源。写死 "-pmysql_root_pass" 的话，
      # 一旦有人用 MYSQL_ROOT_PASSWORD 覆盖了root 密码，健康检查用的还是旧密码 ——
      # mysqladmin ping 认证失败 → 容器永远不 healthy → 账号和记忆服务卡在 depends_on 上，
      # 而日志里只会看到 mysql 反复 unhealthy，看不出是密码对不上。
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$${MYSQL_ROOT_PASSWORD}\""]
      interval: 10s
      timeout: 5s
      retries: 10

  memory-service:
    build:
      context: .
      args:
        MODULE: mini-agent-memory-service
    image: miniagent-memory:local
    container_name: miniagent-memory-service
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "127.0.0.1:8091:8091"
    environment:
      MEMORY_SERVICE_ROLE: all
      MEMORY_SERVICE_ADDRESS: 0.0.0.0
      MEMORY_SERVICE_PORT: 8091
      DB_URL: jdbc:mysql://mysql:3306/mini_agent_memory?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai&characterEncoding=UTF-8
      DB_USERNAME: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD 必须显式设置}
      ACCOUNT_BASE_URL: http://account:8081
      # 内部密钥与记忆令牌密钥由两个服务的 application.yml 内置默认值提供（两者必须一致）。
      # 这里不再注入：注入空串会覆盖 yml 默认值，导致启动校验失败。
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_MODEL: ${LLM_MODEL:-}
    volumes:
      - memory-service-data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8091/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 45s

  # 账号与会员服务：登录、注册、会员等级、充值。
  # 库是 mini_agent，只建 tenants / users / membership_*。
  # Agent 在桌面端，用本机 H2，不在这里启动。
  account:
    build:
      context: .
      args:
        MODULE: mini-agent-account
    image: miniagent-account:local
    container_name: miniagent-account
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "8081:8081"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:mysql://mysql:3306/mini_agent?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai&characterEncoding=UTF-8
      DB_USERNAME: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD 必须显式设置（不要使用仓库示例值）}
      # ACCOUNT_INTERNAL_KEY / ACCOUNT_MEMORY_TOKEN_KEY 由 application.yml 内置默认值提供。
      # 不在这里注入：注入空串会覆盖默认值（Spring 的 ${VAR:default} 在 VAR 存在但为空时
      # 取空串），而注入真实值等于把密钥再写一份到编排文件里。
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8081/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s

volumes:
  mysql-data:
  memory-service-data:
